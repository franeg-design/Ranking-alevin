  /* La pastilla "← Competiciones" se retiró (jul-2026): abajo ya hay control de volver. El
     manejador se deja porque no molesta y devuelve el botón a la vida si se reintroduce. */
  const cbk=cl(".compBack");if(cbk){compFecha=null;render();scrollSec();return;}
  const bb=cl(".badgeBtn");if(bb){badgesFor=bb.dataset.n;render();scrollSec();return;}
  const cb=cl(".cmpBtn");if(cb){cmpA=cb.dataset.n;cmpB=null;render();scrollSec();return;}
  const cp=cl(".cmpPick");if(cp){cmpB=cp.dataset.n;render();scrollSec();return;}
  const cc=cl(".cmpClose");if(cc){cmpA=null;cmpB=null;render();return;}
  /* EL HISTORIAL SOLO SE ABRE DESDE SU PASTILLA (21-ago-2026, petición de Fran). Antes valía
     `cl(".pRow.tog")`, o sea cualquier punto de la fila, y eso obligaba a un parche justo aquí
     —`if(cl(".cur"))return;`— para que arrastrar el dedo por la montaña de «Su sitio en la prueba»
     (§4.44) no desplegara además el historial al soltar. Al acotar el toque a `.hPill`, ese parche
     deja de hacer falta y se retira: la fila entera vuelve a ser inerte y cada gesto tiene dueño.
     ⚠️ Si algún día se vuelve al "toca donde sea", hay que reponer el guardarraíl de `.cur`. */
  const hp=cl(".hPill");if(hp){const pr=hp.closest(".pRow");if(pr)toggleHist(pr);return;}
  const t=cl(".name");if(t&&t.dataset&&t.dataset.n)goProfile(t.dataset.n);
});
/* ===== PUNTO QUE SIGUE AL DEDO EN «SU SITIO EN LA PRUEBA» (§4.44) =========================
   Delegado en #view: los gráficos se repintan enteros en cada render(), así que unos manejadores
   colgados de cada <div class="cur"> se perderían en el primer repintado.
   El tiempo que enseña es el de ESA VERTICAL DEL EJE, no la marca de nadie: el eje es continuo y
   puede caer en un hueco donde no nadó nadie (decisión de Fran, 21-ago-2026). */
let SCRUB=null,SCRUB_T=null;
function scrubMover(cur,cx){
  const sc=cur.querySelector(".scrub");if(!sc)return;
  const pt=sc.querySelector(".sPt"),lab=sc.querySelector(".sLab");
  const H=(cur.dataset.h||"").split(",").map(Number);if(H.length<2)return;
  const lid=+cur.dataset.lid,corte=+cur.dataset.corte;
  const r=cur.getBoundingClientRect();if(!r.width)return;
  const x=Math.max(0,Math.min(100,((cx-r.left)/r.width)*100));
  const f=x/100*(H.length-1),i=Math.floor(f),j=Math.min(H.length-1,i+1);
  const y=H[i]+(H[j]-H[i])*(f-i);
  pt.style.left=x.toFixed(2)+"%";pt.style.top=y.toFixed(1)+"px";
  lab.textContent=fmtClock(Math.round(lid+(100-x)/100*(corte-lid)));
  lab.style.left=Math.max(12,Math.min(88,x)).toFixed(2)+"%";
  /* ALTO DEL GLOBO ≈ 17 px (11 px de letra + 2+2 de relleno). Va pegado al punto, pero con TOPE:
     al llegar al techo del gráfico se queda ahí en vez de seguir subiendo, así que en la mayor
     parte del recorrido no se mueve en vertical. Solo se pone debajo en los picos —donde arriba
     ya no cabe— y con histéresis (baja por debajo de 12, vuelve a subir por encima de 16) para
     que no parpadee yendo y viniendo en el umbral. */
  const ALTO=17,SEP=8;
  /* COLOCACIÓN DEL GLOBO — dos reglas, en este orden:
     1) NUNCA tapa el punto. Se consigue no recortando: el globo se queda siempre a SEP píxeles
        del punto (8 > 4,5 del radio), arriba o abajo. Fue el recorte contra el techo lo que lo
        hacía montarse encima en las alturas intermedias.
     2) De los dos lados se elige EL QUE MENOS SE SALE del gráfico, y solo se cambia de lado si el
        otro mejora por más de 4 px. Ese margen es la histéresis: con un umbral seco, una silueta
        de varias jorobas hacía cambiar de lado hasta nueve veces en un barrido. */
  /* El LADO se decide con la altura SUAVIZADA (media de ±6 casillas, ≈12 % del eje), no con la
     instantánea: en una silueta de peine, cada diente hacía cambiar de lado. La POSICIÓN, en
     cambio, usa la altura real, que es lo que mantiene los 8 px de separación con el punto. */
  let suma=0,cuenta=0;
  for(let k=-6;k<=6;k++){const q=i+k;if(q>=0&&q<H.length){suma+=H[q];cuenta++;}}
  const ySuave=suma/cuenta;
  const sobraArriba=Math.max(0,ALTO+SEP-ySuave), sobraAbajo=Math.max(0,ySuave+SEP+ALTO-34);
  let baja=lab.classList.contains("baja");
  if(baja?(sobraArriba+4<sobraAbajo):(sobraAbajo+4<sobraArriba))baja=!baja;
  /* Tope duro: en la cresta de un pico alto el lado suavizado se saldría hasta 21 px por arriba,
     encima del rótulo. Si el lado elegido se sale más de 12 px y el otro cabe mejor, se cambia
     aunque la suavizada dijera lo contrario. Pasa solo en la cresta y devuelve dos cambios. */
  const fueraA=Math.max(0,ALTO+SEP-y), fueraB=Math.max(0,y+SEP+ALTO-34);
  if(baja?(fueraB>12&&fueraA<fueraB):(fueraA>12&&fueraB<fueraA))baja=!baja;
  lab.classList.toggle("baja",baja);
  const top=baja?y+SEP:y-SEP;
  /* la primera colocación no se anima: aparecería viajando desde donde quedó la vez anterior */
  if(!sc.classList.contains("on")){lab.classList.remove("desliza");lab.style.top=top.toFixed(1)+"px";
    requestAnimationFrame(()=>lab.classList.add("desliza"));}
  else lab.style.top=top.toFixed(1)+"px";
  sc.classList.add("on");clearTimeout(SCRUB_T);
}
function scrubSoltar(){
  if(!SCRUB)return;const sc=SCRUB.querySelector(".scrub");SCRUB=null;
  clearTimeout(SCRUB_T);SCRUB_T=setTimeout(()=>{if(sc&&sc.classList)sc.classList.remove("on");},5000);
}
el("view").addEventListener("touchstart",e=>{
  const c=e.target&&e.target.closest?e.target.closest(".cur"):null;if(!c)return;
  SCRUB=c;scrubMover(c,e.touches[0].clientX);},{passive:true});
el("view").addEventListener("touchmove",e=>{
  if(!SCRUB)return;scrubMover(SCRUB,e.touches[0].clientX);e.preventDefault();},{passive:false});
["touchend","touchcancel"].forEach(t=>el("view").addEventListener(t,scrubSoltar));
el("view").addEventListener("mousedown",e=>{
  const c=e.target&&e.target.closest?e.target.closest(".cur"):null;if(!c)return;
  SCRUB=c;scrubMover(c,e.clientX);});
window.addEventListener("mousemove",e=>{if(SCRUB)scrubMover(SCRUB,e.clientX);});
window.addEventListener("mouseup",scrubSoltar);
el("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;render();});
el("segSex").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;sexFilter=b.dataset.s;el("segSex").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));applySex();});
function cambiarCat(c,hist){
  if(hist){if(c===catHist)return;catHist=c;}else{if(c===catTemp)return;catTemp=c;}
  if(hist!==isHist()){fillCats();return;}   /* tocar el de arriba estando en Histórico: solo se anota
                                               para cuando vuelvas a la temporada, no recarga nada */
  /* ⚠️ CAUSA DEL PARPADEO, encontrada tras cuatro intentos fallidos: aquí se hacía
     `compsFor=null; sumFecha=null`. Eso tira abajo el resumen de competición que estabas viendo y
     lo vuelve a montar desde cero — se veía como si la tarjeta dorada y el carrusel de pruebas
     desaparecieran y reaparecieran. El botón de Fem./Masc. nunca parpadeó porque NO los toca: se
     limita a cambiar la variable y llamar a applySex().
     Ahora se conserva lo que se estaba viendo y solo se suelta si deja de existir en el nuevo
     ámbito (una competición donde esa categoría no nadó, o una ficha que ya no está). */
  yearFilter=[];
  /* EL RESUMEN ABIERTO SE CIERRA (21-ago-2026, petición de Fran). Un resumen es el de UNA
     competición vista DESDE UNA categoría: al cambiar de ámbito deja de ser el mismo documento.
     Antes sobrevivía cuando esa jornada existía también en la categoría nueva (el 49,1 % de los
     casos) y se llevaba por delante la banda cuando no (el 50,9 %): dos comportamientos para el
     mismo gesto. Ahora siempre se cierra, y la banda se queda como estaba.
     ⚠️ `sumFecha` NO se toca aquí a propósito: si esa competición sigue existiendo en la categoría
     nueva, al desplegar la banda la encuentras marcada con el ✓ donde la dejaste. Y si no existe,
     la suelta el guardarraíl de `renderSummary`. Ponerlo a `null` aquí era, además, la mitad de la
     causa del parpadeo que se cazó en su día (ver el aviso de abajo). */
  sumShown=false;sumOpen=false;
  const compPrev=compsFor;
  applySex();
  /* Aquí había un `if(fechaPrev&&summaryFechas().indexOf(fechaPrev)<0){sumFecha=null;render();}`.
     Se retira: soltaba la jornada huérfana DESPUÉS de que `applySex()` ya hubiera llamado a
     `renderSummary` con ella —o sea, después del estropicio— y encima forzaba un segundo `render()`.
     El guardarraíl vive ahora dentro de `renderSummary`, que es el único sitio donde se sabe si la
     jornada tiene filas, y desde allí cubre también el cambio de sexo y el de temporada. */
  if(compPrev&&!ALLRECS.some(r=>r.nadadora===compPrev&&r.sexo===sexFilter&&(isHist()||seasonOf(r.fecha)===season)&&(!catFilter||catFilter==="all"||grupoDe(r.anio,r.fecha)===catFilter))){compsFor=null;badgesFor=null;cmpA=null;cmpB=null;render();}
}
el("segCatH").addEventListener("change",e=>{cambiarCat(e.target.value,false);});
el("segCat").addEventListener("click",e=>{const b=e.target.closest("button");if(b)cambiarCat(b.dataset.c,true);});
/* Reglas del segmentado de años (Fran, ago-2026):
   · "Todas" apaga las demás · en Histórico cada pastilla alterna (se pulsa otra vez para quitarla)
   · quitar la última equivale a "Todas": lista vacía, nunca un ranking en blanco
   · en modo temporada sigue siendo excluyente, como toda la vida.
   ⚠️ Se repintan las clases a mano, no con fillYears(): en el ranking `render()` NO reconstruye este
   segmentado (solo lo hace con una ficha abierta), y rehacer el innerHTML aquí haría parpadear la fila. */
el("segYear").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const y=b.dataset.y;
  if(y==="all")yearFilter=[];
  /* «Abs joven» marca o desmarca de golpe el 06 y el 07 (§4.45) */
  else if(y==="0607"){const puestos=yearOn("2006")&&yearOn("2007");
    yearFilter=yearFilter.filter(v=>v!=="2006"&&v!=="2007");
    if(!puestos)yearFilter.push("2006","2007");}
  else if(!multiYear())yearFilter=[y];
  else{const i=yearFilter.indexOf(y);if(i>=0)yearFilter.splice(i,1);else yearFilter.push(y);}
  el("segYear").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.y==="all"?yearAll():yearOn(x.dataset.y)));
  render();});
