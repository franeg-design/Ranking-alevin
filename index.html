    /* ⚠️ Dos causas distintas otra vez (§4.26). Este `return` es la salida de TODO estilos que no
       trae los cuatro tramos: el 100 (que nunca los tiene) y, desde que hay nota en piscina larga,
       un 200 o un 400 cuyo acta viene cada 100 m. Decirle «en 100 estilos» a quien mira un 200 es
       falso. El texto sigue a la distancia. */
    return {rows:rows,notes:[],glob:dist===100
      ?"En 100 estilos cada tramo mezcla dos estilos distintos: se muestran los parciales sin comparar ritmos."
      :"El acta solo trae los parciales cada 100 m, y en estilos cada tramo de 100 mezcla dos estilos: se muestran los parciales sin comparar ritmos.",
      gkey:"na",lab:"Parciales",score:null};
  }
  // ---------- FONDO (400/800) ----------
  if(dist>=400){
    /* CADENCIA EXIGIDA, NO DEDUCIDA (ago-2026). Antes el paso salía de `vals.length<dist/50?100:50`,
       así que SEIS parciales de 50 en un 400 se leían como parciales de 100 y salía una nota falsa
       y perfectamente creíble: "200-300 m · Crucero — tu ritmo de crucero ha sido de 42.07 por 100"
       cuando 42.07 era su ritmo por 50. El §2 del MANUAL ya prohíbe guardar subconjuntos en fondo,
       pero eso es disciplina de datos, no una defensa: ahora el motor lo comprueba y, si la cadencia
       no es una de las dos válidas, NO valora. Las dos formas legales son:
         · cada 50  → los `dist/50` huecos, todos rellenos
         · cada 100 → los `dist/50` huecos con valor solo en las posiciones impares (100, 200, …)
       Cualquier otra cosa cae en "parciales sin valorar", que es lo honesto. */
    const n50=dist/50;
    const cada50=slots.length===n50&&slots.every(Boolean);
    const cada100=slots.length===n50&&vals.length===n50/2&&slots.every((x,i)=>(i%2===1)===!!x);
    const step=cada50?50:(cada100?100:0);
    if(!step){
      slots.forEach((x,i)=>{if(!x)return;const c=toCs(x);if(isFinite(c))rows.push(pcRow(((i+1)*50)+"m",x,pcNom(i,slots.length,false),PC_SIN_VAL,bw(c)));});
      return {rows:rows,notes:[],glob:"Los parciales de esta carrera no vienen completos (ni cada 50 ni cada 100), así que no se valora el ritmo: se muestran tal cual.",gkey:"na",lab:"Parciales",score:null};
    }
    /* CRUCERO = los largos que la pantalla llama Crucero: sin el primero (Salida) y SIN EL ÚLTIMO
       (Final). Antes `m` incluía el último, así que la nota Final comparaba ese largo contra una
       media que lo contenía a él mismo, y encima convivía con otra media distinta (`cruT`) para la
       Transición. Ahora hay UNA media y coincide con lo que se ve en las filas. */
    const mid=cs.slice(1,-1);
    if(mid.length>=3){
      const m=mid.reduce((a,b)=>a+b,0)/mid.length;
      const sd=Math.sqrt(mid.reduce((a,b)=>a+(b-m)*(b-m),0)/mid.length),cv=sd/m*100;
      const B=PC_CV[dist]||PC_CV[400];
      const gcvDisp=pcScore1(cv,B[0],B[1],B[2]);
      /* pendiente de los largos de crucero, en % del ritmo medio y por largo */
      const nMid=mid.length,mxi=(nMid-1)/2;
      let dnum=0,dden=0;for(let i=0;i<nMid;i++){dnum+=(i-mxi)*(mid[i]-m);dden+=(i-mxi)*(i-mxi);}
      const der=dden?dnum/dden/m*100:0;
      const sDer=der<=PC_DER[0]?100:pcOut(der-PC_DER[0],PC_DER[1]-PC_DER[0],PC_DER[2]-PC_DER[0],30,0);
      /* el crucero falla si falla la dispersión O la tendencia: se queda con la peor lectura */
      const gcv=Math.min(gcvDisp,sDer);
      const salR=step===50?pcSalida(prueba,cs[0],nadadora,fecha,L):null;
      const sal=(salR&&!salR.inval)?salR:null, inval=(salR&&salR.inval)?salR:null;
      const last=cs[cs.length-1];
      const tr=step===50?pcTrans(prueba,cs[0],m):null;
      /* ⚠️ SEGUNDO REORDEN DEL BLOQUE (ago-2026). `tr` ya se había subido en jul-2026 por encima de
         la nota de Salida; ahora sube también por encima del forEach que pinta las filas, porque el
         rescate cambia la nota que se enseña en la fila de Salida. Si se vuelve a mover algo aquí,
         el orden obligatorio es: crucero → sal → tr → rescate → filas → notas → global. */
      /* RESCATE GRADUADO — ver el comentario largo en el bloque del 200. En fondo el "resto" son los
         dos tramos que puntúan en la global aparte de la Salida: Crucero (65%) y Transición (15%).
         El cierre no entra porque en fondo tampoco entra en la global: es un bonus de +5, no un
         tramo con peso. En 800 y 200 Mariposa la Transición no puntúa (`PC_TRA_NS`) pero su valor
         sí existe, así que la condición 2 —escalón dentro de banda— se sigue comprobando igual. */
      /* La evidencia en fondo es el CIERRE: si el último tramo se cae, la salida extrema se pagó.
         `dLast`/`sLast` se calculaban más abajo; suben aquí porque `evSal` los necesita antes de
         pintar la fila de Salida. Orden fijo del bloque: crucero → sal → tr → cierre → evSal →
         rescate → filas → notas → global. */
      const dLastE=(last-m)/m*100, sLastE=last<m?100:pcOut(dLastE,B[0],B[1],40,0);
      let sSal=sal?sal.sc:null,salResc=null;
      const evSal=pcSalEvid(sal,sLastE);
      if(pcSalPuntua(evSal)&&sal.d<sal.B[0]&&sal.d>=sal.B[4]&&tr&&tr.d<=tr.B[1]){
        const otros=[gcv];if(tr.sc!=null)otros.push(tr.sc);
        const rp=[[gcv,.65]];if(tr.sc!=null)rp.push([tr.sc,.15]);
        const resto=rp.reduce((a,p)=>a+p[0]*p[1],0)/rp.reduce((a,p)=>a+p[1],0);
        if(Math.min.apply(null,otros)>=50&&resto>sSal){salResc={resto:true};sSal=Math.min(100,resto);}
      }
      /* Igual que en 200 y 100: sin nota en la fila, no hay peso en la global. Ver el comentario
         del bloque del 200. Aquí el `parts` de abajo pregunta por `sSal!=null`, no por `sal`. */
      if(!pcSalPuntua(evSal))sSal=null;
      cs.forEach((c,i)=>{
        if(i===0){
          rows.push(pcRow(((i+1)*step)+"m",vals[i],"Salida",sal?pcSalNiv(sal,sSal,pcSalPuntua(evSal)):PC_NO_NOTA,bw(c)));
          return;
        }
        const dv=(c-m)/m*100,sc=pcScore1(dv,B[0],B[1],B[2]);
        rows.push(pcRow(((i+1)*step)+"m",vals[i],pcNom(i,cs.length,true),pcNivel(sc),bw(c)));
      });
      if(sal)notes.push({k:pcSalPuntua(evSal)?pcNivel(sSal).key:"na",m:step+" m · Salida",t:`Has pasado el primer ${step} ${pcSalCmp(sal.d,sal.B)} tu mejor 50${pcRefF(sal,fecha)} (en esta distancia lo normal es ${nc(sal.B[0])}–${nc(sal.B[1])}%).`+
        pcSalToque(evSal,dist,null)});
      else if(inval)notes.push({k:"na",m:step+" m · Salida",t:`Ya has nadado el primer largo de un 100 más rápido que tu mejor 50 de ${est.toLowerCase()} (<b>${fmtClock(inval.b50)}</b>${pcRefF(inval,fecha)}), así que esa marca se ha quedado corta y la salida no lleva nota. La regularidad y el escalón hasta el ritmo de crucero sí se valoran igual.`});
      // 65% regularidad + 20% Salida + 15% Transición, normalizado a lo disponible
      const parts=[[gcv,.65]];
      if(sSal!=null)parts.push([sSal,.20]);
      if(tr&&tr.sc!=null)parts.push([tr.sc,.15]);
      let g=Math.round(parts.reduce((a,p)=>a+p[0]*p[1],0)/parts.reduce((a,p)=>a+p[1],0));
      if(last<m)g=Math.min(100,g+5);
      const tnota=pcTraNota(tr,!!sal);if(tnota)notes.push(tnota);
      const cvTxt=`Los largos de crucero se han movido entre sí un <b>${nc(cv.toFixed(cv>B[1]&&cv.toFixed(1)===B[1].toFixed(1)?2:1))}%</b>: ${cv<=B[0]?"menos del "+nc(B[0])+"% que se considera un crucero impecable":cv<=B[1]?"dentro del "+nc(B[1])+"% que se considera un ritmo regular":"más del "+nc(B[1])+"% que marca el límite de un ritmo regular"}.`;
      /* Si la tendencia es la que falla hay que decirlo: "se han movido poco entre sí" es verdad y a
         la vez engañoso cuando cada largo es más lento que el anterior. */
      const derTxt=der>PC_DER[0]
        ? ` Pero el ritmo se ha ido cayendo de forma constante, <b>${dec(der)}%</b> por ${step}: del primer largo de crucero (${fmtClock(mid[0])}) al último (${fmtClock(mid[nMid-1])}).`
        : (der<-PC_DER[0]?` Y además has ido acelerando <b>${dec(Math.abs(der))}%</b> por ${step}: de ${fmtClock(mid[0])} a ${fmtClock(mid[nMid-1])}.`:"");
      notes.push({k:pcNivel(gcv).key,m:(step*2)+"-"+(dist-step)+" m · Crucero",
        t:`Tu ritmo de crucero ha sido de <b>${fmtClock(Math.round(m))}</b> por ${step}. `+cvTxt+derTxt});
      const dLast=dLastE, sLast=sLastE;   // calculados arriba: evSal los necesita antes
      notes.push({k:pcNivel(sLast).key,m:dist+" m · Final",
        t:last<m?(der>PC_DER[0]
            ?`Has cerrado el último ${step} un <b>${dec(Math.abs(dLast))}%</b> más rápido que tu ritmo medio de crucero, pero ojo: ese ritmo medio va inflado porque los largos se iban cayendo. Frente al último largo de crucero (${fmtClock(mid[nMid-1])}) el cierre sí ha sido más rápido.`
            :`Has cerrado el último ${step} un <b>${dec(Math.abs(dLast))}%</b> más rápido que tu ritmo de crucero: te quedaba depósito. Eso es dosificar bien.`)
                :`El último ${step} ha sido un <b>${dec(dLast)}%</b> más lento que tu ritmo de crucero.`+pcT(Math.min(sLast,89),PC_TFINF)});
      const n=pcNivel(g);
      const glob=(der>PC_DER[0]?(g>=70?"El tempo se ha sostenido en lo grueso, pero se va cayendo largo tras largo: el último largo de crucero ya no va como el primero. En fondo el tiempo está justo ahí."
                                      :"El ritmo se ha ido soltando por el camino, cada largo un poco más lento que el anterior. Salir un punto más suave y sostener el tempo da tiempos mejores.")
        :g>=90?"Ritmo de crucero admirable. En fondo gana quien sostiene el mismo tempo largo tras largo, y eso lo has hecho."
        :g>=70?"Ritmo sólido en general, con algún largo que se escapa del tempo. Series largas a ritmo fijo lo van a pulir."
        :g>=50?"El tempo se sostiene a ratos: hay largos que se salen del ritmo de crucero. Trabajar ritmo controlado es la clave."
        :g>=30?"El ritmo se va soltando por el camino. Conviene salir un punto más suave para sostener el final."
        :"La regularidad se ha perdido pronto. En fondo, salir más suave y sostener el tempo da tiempos mejores.")
;
      return done(g,glob);
    }
    cs.forEach((c,i)=>rows.push(pcRow(((i+1)*step)+"m",vals[i],pcNom(i,cs.length,true),PC_SIN_VAL,bw(c))));
    return {rows:rows,notes:[],glob:"Parciales de la prueba (sin datos suficientes para valorar la regularidad).",gkey:"na",lab:"Parciales",score:null};
  }
  // ---------- 100 m ----------
  if(dist===100&&cs.length===2){
    const B=PC_100[est]||PC_100.Libre,d=(cs[1]-cs[0])/cs[0]*100;
    // Salida: contra su MMP de 50 (la decisión de salida). Final: la caída (la resistencia).
    const salR=pcSalida(prueba,cs[0],nadadora,fecha,L);
    const sal=(salR&&!salR.inval)?salR:null, inval=(salR&&salR.inval)?salR:null;
    let s2=d<=B[1]?100:pcOut(d-B[1],B[3]-B[1],B[5]-B[1],30,0);
    /* SALIDA CONDICIONADA (jul-2026). Salir fuerte no es un error por sí mismo: en los datos
       de esta app la salida agresiva va asociada a MEJORES carreras (z FINA intra-sujeto +0,09
       y +0,32 frente a -0,26 y -0,07). Solo resta si LO PAGÓ. "Sostuvo la forma" se mide contra
       su propia plantilla cuando la hay, y si no contra la banda de categoría. Nunca contra el
       crono: dos carreras con los mismos parciales tienen que sacar la misma nota. */
    const tpl=bestShape(nadadora,prueba,fecha,L);
    /* caidaFuera: ¿el segundo largo se ha caído más de lo que marca su banda buena? Es el dato
       que manda para los TEXTOS, porque no depende de ninguna referencia externa —solo compara
       los dos largos entre sí (ver JERARQUÍA DE FIABILIDAD más abajo)—, mientras que la NOTA que
       se enseña puede venir rescatada por la plantilla propia y valer 75 con una caída mala.
       La nota no se toca: esto solo decide qué se escribe. */
    const caidaFuera=d>B[1];
    /* NOTA QUE SE VE vs NOTA QUE ESCRIBE (jul-2026). Tres textos distintos se eligen con s2 y los
       tres afirman cosas ABSOLUTAS sobre el segundo largo: la frase de la Salida, la coletilla del
       Final y la cola de la Valoración. Como s2 puede venir rescatada por la plantilla propia,
       los tres proclamaban "ha aguantado" encima de una caída fuera de banda (Carla Eguiguren,
       100 Libre 14-jun: caída 12,6% con la banda buena hasta 9,1%, nota bruta 35 rescatada a 75).
       Solución: con la caída fuera, los TEXTOS se eligen con la nota tapada a 69, que es el
       escalón justo por debajo de las frases de "sostenido/aguantado" en pcT. La nota que se
       ENSEÑA sigue siendo s2 intacta: la pastilla y la línea de "tu caída habitual" ya explican
       por qué es buena. Se probó usar la nota bruta y no vale: con 35 sale "Ahí baja la nota del
       Final" al lado de una pastilla de 75, que es cambiar una contradicción por otra. */
    const scTxt=()=>caidaFuera?Math.min(s2,69):s2;
    if(tpl!=null&&d<B[5]&&d-tpl<=2.8)s2=Math.max(s2,75);
    /* ⚠️ AQUÍ VIVÍA EL RESCATE POR LA VUELTA — RETIRADO (ago-2026, decisión de Fran).
       La vuelta era el 2º largo medido contra su mejor 50, y servía para preguntar "¿pagó la salida
       fuerte?". Se quita entera: confundía al leerla (dos cifras del MISMO largo, la caída y la
       vuelta, con veredictos distintos) y colgaba de la misma referencia de 50 que la Salida, así
       que si ese 50 estaba viejo las dos iban infladas a la vez.
       Ahora el 2º largo solo se juzga por LA CAÍDA, que compara los dos largos entre sí y no
       depende de ninguna referencia externa. La constante PC_VUE se ha eliminado.
       Coste medido: 75 salidas de 100 que iban rescatadas pasan a llevar la penalización. Es el
       precio de que la Salida y el Final dejen de apoyarse en la misma vara.
       ⚠️ NO REINTRODUCIR un rescate de la Salida del 100 apoyado en la caída: la caída lleva el 1er
       largo en el denominador y sube sola al salir más rápido (r=−0,20; dos carreras de la misma
       nadadora con el 2º largo en 45,53 y 45,48 daban caídas de 4,7% y 11,9%). */
    /* PESO 50/50 (jul-2026). Antes 40/60 sin justificación documentada. Cada mitad es la mitad
       de la carrera, y el 60% recaía en la medida más débil: la caída es un cociente que lleva el
       1er largo en el denominador, así que no es lectura independiente del 2º; la Salida sí lo es
       (referencia externa: su mejor 50). No ablanda: la mitad baja del semáforo se queda en el 23%
       con los dos pesos, solo se reparte con menos extremos. */
    /* La Salida solo puntúa si es caso evidente; por eso `evSal` va DESPUÉS de s2, que es la
       evidencia, y ANTES de `g`, que la necesita. Fuera de ahí `s1` es null y la global del 100
       pasa a ser la nota del Final. Orden fijo: caída → s2 → evSal → g → filas → notas → global. */
    const evSal=pcSalEvid(sal,s2), s1=pcSalPuntua(evSal)?sal.sc:null;
    const g=Math.round(s1==null?s2:(s1*0.5+s2*0.5));
    /* La fila distingue TRES estados, no dos: con nota, sin referencia porque nunca nadó un 50, y
       sin referencia porque la suya quedó invalidada. Los dos últimos van en gris pero dicen cosas
       distintas, y el texto lo explica. */
    rows.push(pcRow("50m",vals[0],"Salida",sal?pcSalNiv(sal,s1,pcSalPuntua(evSal)):PC_NO_NOTA,bw(cs[0])));
    rows.push(pcRow("100m",vals[1],"Final",pcNivel(s2),bw(cs[1])));
    /* SEGUNDA LECTURA (ago-2026): el planteamiento de hoy contra el de su mejor 100 anterior. Va en
       todos los casos en que exista, tenga o no nota la Salida, porque es la única referencia que
       queda cuando el 50 se invalida. Solo texto — ver el comentario de pcEstrat. */
    const ES=pcEstrat(nadadora,est,fecha,cs[0],cs[1],L);
    /* Arranca por el complemento ("Comparado con…") a propósito: si empieza por el sujeto, "ese
       mismo 50" queda sin antecedente claro entre "tu mejor 50" y "el primer 50 de hoy", que van
       los dos en la frase anterior. Y "anterior" evita leer "tu mejor 100" como el de hoy cuando
       la carrera que se está viendo ES la mejor. */
    const esRef=ES?`tu mejor 100 anterior${ES.mes?" ("+ES.mes+")":""}`:"";
    const esTxt=!ES?"":(` Comparado con ${esRef}, ese primer largo ha ido un <b>${nc(Math.abs(ES.p).toFixed(1))}%</b> ${ES.p<0?"más rápido":"más lento"}`
      /* ⚠️ AQUÍ IBA UNA COLETILLA SOBRE EL REPARTO ("y el reparto cargó más en la salida que
         entonces"). Se retira con el rediseño de ago-2026 por tres motivos que se acumulan:
         · es una EVALUACIÓN del reparto, y la Salida ya no evalúa;
         · choca de frente con lo que la propia tarjeta acaba de decir — 14 carreras juntaban
           "cargó más en la salida" con "has salido con freno", y otras 12 el par contrario;
         · y es REDUNDANTE: reparto y caída son la misma medida (r=−1,00), así que la línea gris
           de "tu caída habitual" ya lo cuenta, con su propio umbral calibrado y mejor dicho.
         Queda solo la cifra, que sí es un dato que no está en ningún otro sitio. */
      +".");
    if(sal)notes.push({k:pcSalPuntua(evSal)?pcNivel(s1).key:"na",m:"50 m · Salida",t:`Has pasado el primer 50 ${pcSalCmp(sal.d,sal.B)} tu mejor 50 de ${est.toLowerCase()}${pcRefF(sal,fecha)} (lo normal es ${nc(sal.B[0])}–${nc(sal.B[1])}%).`+
      esTxt+pcSalToque(evSal,100,ES?ES.p:null)});
    else if(inval)notes.push({k:"na",m:"50 m · Salida",t:`Ya has nadado el primer largo de un 100 más rápido que tu mejor 50 de ${est.toLowerCase()} (<b>${fmtClock(inval.b50)}</b>${pcRefF(inval,fecha)}), así que esa marca se ha quedado corta y la salida no lleva nota.`+
      esTxt+pcSalSinRef(s2,caidaFuera,d,B,est,ES?ES.p>0:false)});
    else notes.push({k:"na",m:"50 m · Salida",t:`La salida no se puede valorar: aún no tienes ninguna marca de 50 ${est.toLowerCase()} con la que compararla.`+esTxt+(ES?pcSalSinRef(s2,caidaFuera,d,B,est,ES.p>0):"")});
    /* ⚠️ Aquí había una aclaración larga que compaginaba la caída con la VUELTA cuando se
       contradecían. Se cae con la vuelta (ago-2026): ya no hay dos cifras del mismo largo. */
    notes.push({k:pcNivel(s2).key,m:"100 m · Final",t:`Caída del 2º largo: <b>${fmtp(d)}</b> (el rango bueno en ${est.toLowerCase()} es ${nc(B[0])}–${nc(B[1])}%).`
      /* La caída no depende de ninguna referencia externa: compara los dos largos entre sí. Por eso
         es la ÚNICA lectura del 2º largo desde ago-2026, cuando se retiró la vuelta. Aquí había una
         aclaración que compaginaba las dos cuando discrepaban; sin vuelta ya no hace falta. */
      /* Misma regla: la coletilla comenta la caída que se acaba de escribir dos palabras antes,
         así que NO puede decir "el segundo largo ha aguantado" si esa caída está fuera de banda.
         Con la caída fuera se usa siempre PC_TFIN100[4], que dice dónde está el margen y —esto
         importa— NO menciona la nota: se probó elegir la coletilla con la nota bruta y salía
         "Ahí baja la nota del Final" al lado de una pastilla que marcaba 75, o sea cambiar una
         contradicción por otra. La pastilla y la línea de "tu caída habitual" ya explican por qué
         la NOTA es buena; la coletilla se limita a describir el hecho. */
      +pcT(scTxt(),PC_TFIN100)});
    /* ⚠️ Con s1==null la global se apoya SOLO en el Final, así que esta frase afirmaba que el 2º
       largo aguantó incluso con la caída fuera de banda (Xabier, 100 Braza 14-jun: caída 12,1% con
       el rango hasta 11,7% y global 95). Se comprueba `caidaFuera` antes de elogiarlo. */
    const glob=(g>=90?(s1==null?(caidaFuera?`Carrera bien resuelta, con el segundo largo cayendo más de lo que marca el rango bueno en ${est.toLowerCase()} (${nc(B[0])}–${nc(B[1])}%): ahí está el margen.`
                                           :"Carrera bien gestionada: el segundo largo aguanta como tiene que aguantar.")
                              :"Carrera bien gestionada. En 100 se sale con cabeza y se vuelve con corazón, y eso es lo que has hecho.")
      :g>=70?"Buena gestión en conjunto, con un punto de mejora en el reparto. Estás muy cerca del 100 ideal."
      :g>=50?(s1==null?"100 correcto, pero el segundo largo se cae más de la cuenta: ahí está el margen."
                      :"100 correcto, pero el reparto entre los dos largos se puede afinar bastante.")
      /* Con peso 50/50 una carrera puede bajar de 50 SOLO por la salida, con el final intacto.
         Las frases de abajo daban por hecho que el final se había caído, y luego pcT(s2,...) añadía
         un elogio al final: "revisa cómo sales para poder sostener el final" + "aguante notable".
         Si el Final está bien (>=70), la culpa es solo del arranque y así hay que decirlo. */
      /* ⚠️ Con `s1==null` la global es EXACTAMENTE la nota del Final, así que no puede culpar al
         arranque: no hay nota de arranque. Y la rama `s2>=70` es entonces inalcanzable (g===s2). */
      :g>=30?(s1==null?"El segundo largo se ha caído bastante: el margen está en sostener el ritmo hasta el final."
                    :s2>=70?"El arranque ha desequilibrado la carrera: el final lo has defendido, así que el margen está entero en cómo sales."
                    :"El reparto ha desequilibrado la carrera: revisa cómo sales para poder sostener el final.")
      :(s1==null?"Carrera muy desequilibrada: el segundo largo se ha ido del todo. Base aeróbica para sostenerlo."
              :s2>=70?"Carrera muy desequilibrada por el arranque: has salido demasiado fuerte y el final lo has sacado a pulso."
              :"Carrera muy desequilibrada: el arranque ha pasado factura. Base aeróbica para sostener el final."))
      +" "+pcT(scTxt(),PC_T100[est]||PC_T100.Libre);

  }
  // ---------- 200 m ----------
  if(dist===200&&cs.length===4&&per50){

    const fh=cs[0]+cs[1],sh=cs[2]+cs[3],d=(sh-fh)/fh*100;
    const cru=(cs[1]+cs[2])/2;                       // ritmo de crucero de la carrera
    const salR=pcSalida(prueba,cs[0],nadadora,fecha,L);

    let sSal=sal?sal.sc:null;
    const scCru=c=>{const dv=Math.abs((c-cru)/cru*100);return pcOut(dv-C[0],C[1]-C[0],C[2]-C[0],30,10);};
    const s2=scCru(cs[1]),s3=scCru(cs[2]);

    const evSal=pcSalEvid(sal,sFin);
    /* RESCATE GRADUADO DE LA SALIDA (ago-2026) — 200 y fondo. Hermano del rescate del 100, pero con
       otro aval. En el 100 se pregunta al 2º largo contra su mejor 50 (la "vuelta"); aquí eso no
       existe, así que el aval es EL RESTO DE LA CARRERA, que ya está medido tramo a tramo.
       Regla: una salida fuerte no puede puntuar peor que lo que demuestra el resto de la carrera.
       No es la regla del 100 disfrazada: aquella se apoya en un test intra-sujeto que en 200/fondo
       NO se puede reproducir (8 pares con >=3 carreras frente a 195 cienes, ver MANUAL §7.2.3).
       Esta no afirma nada estadístico, solo aplica "salir fuerte resta si se paga" — y si se pagó
       o no se lee directamente en los otros tramos de esa misma carrera.
       Tres condiciones, todas necesarias:
       1. Salida agresiva (`d < B[0]`) pero no suicida (`d >= B[4]`, p5): igual que en el 100, con el
          margen en el 5% extremo la referencia de 50 no sostiene el peso; ni premia ni castiga.
       2. Transición DENTRO de banda: es la medida directa de "¿salí por encima del ritmo que puedo
          sostener?". Si el escalón al crucero es normal, no te pasaste: es que tu crucero va rápido.
       3. Ningún tramo del resto por debajo de 50. Sin esta condición se rescataba a Alain Casado
          (200 Libre, 24-ene) con el Final en 0: la media ponderada aguantaba en 61 mientras un tramo
          estaba desfondado, y el texto habría prometido que no lo pagó. Por debajo de 50 la carrera
          se resintió en algún sitio, y eso ES haberlo pagado.
       Efecto medido sobre las 143 carreras de 200/fondo con referencia de 50: 16 salidas rescatadas
       de 67 agresivas, 14 globales suben, **0 bajan**, el semáforo global se mueve 1 punto. */
    let salResc=null;
    if(pcSalPuntua(evSal)&&sal.d<sal.B[0]&&sal.d>=sal.B[4]&&tr&&tr.d<=tr.B[1]){

       de `g`, así que la global llevaba una nota de Salida que no se enseñaba en ninguna parte
       (Nikko Moral, 200 Libre 14-jun: fila con guion y 90 puntos metidos en la global, 73 en vez
       de 69). Mismo criterio que el 100, donde `s1` ya se anula antes de `g`.
       ⚠️ El orden es OBLIGATORIO: tramos → tr → evSal → rescate → ANULACIÓN → g → filas. El rescate
       tiene que ir antes porque solo actúa en el caso evidente, o sea cuando sSal sobrevive. */

    rows.push(pcRow("100m",vals[1],"Crucero",pcNivel(s2),bw(cs[1])));
    rows.push(pcRow("150m",vals[2],"Crucero",pcNivel(s3),bw(cs[2])));
    rows.push(pcRow("200m",vals[3],"Final",pcNivel(sFin),bw(cs[3])));
    if(sal)notes.push({k:pcSalPuntua(evSal)?pcNivel(sSal).key:"na",m:"50 m · Salida",t:`Has pasado el primer 50 ${pcSalCmp(sal.d,sal.B)} tu mejor 50 de ${est.toLowerCase()}${pcRefF(sal,fecha)} (lo normal en un 200 es ${nc(sal.B[0])}–${nc(sal.B[1])}%).`+
      pcSalToque(evSal,200,null)});
    else if(inval)notes.push({k:"na",m:"50 m · Salida",t:`Ya has nadado el primer largo de un 100 más rápido que tu mejor 50 de ${est.toLowerCase()} (<b>${fmtClock(inval.b50)}</b>${pcRefF(inval,fecha)}), así que esa marca se ha quedado corta y la salida no lleva nota. El escalón hasta el ritmo de crucero, el crucero y el final sí se valoran igual.`});
    else notes.push({k:"na",m:"50 m · Salida",t:`La salida no se puede valorar: aún no tienes ninguna marca de 50 ${est.toLowerCase()} con la que compararla.`});
    const tnota=pcTraNota(tr,sSal!=null);if(tnota)notes.push(tnota);
    const dv2=Math.abs((cs[1]-cru)/cru*100), dv3=Math.abs((cs[2]-cru)/cru*100), dvm=Math.max(dv2,dv3);

    notes.push({k:pcNivel(sCru).key,m:"100-150 m · Crucero",
      t:`Los dos largos centrales se separan como mucho un <b>${fmtp(dvm)}</b> de tu ritmo medio de crucero.`+pcT(sCru,PC_TCRU200)});
    /* Si el Crucero ya ha mandado series largas a ritmo fijo, el Final no lo repite: salían tres
       veces el mismo consejo entre las dos tarjetas y la valoración. */
    /* ⚠️ La coletilla NO puede contradecir la cifra que acaba de escribirse. `sFin` sale de una
       banda cuyo 100 está en cerrar por DEBAJO de F[0], y F[0] puede ser positivo o negativo según
       el estilo, así que la nota y el signo del cierre no van siempre de la mano. Sin este ajuste
       salían 9 contradicciones reales: "va un N% más lento… te quedaba depósito y lo has usado" (2)
       y "va un N% más rápido… casi todo el mundo cierra más rápido, ahí tienes décimas" (7).
       Mismo patrón que `scTxt()` en el 100: la NOTA que se enseña no se toca, solo se acota la que
       ELIGE el texto. Si aceleró, el texto no baja de 70 (nunca le reprocha no haber acelerado); si
       cerró más lento, no llega a 90 (nunca le felicita por haberlo hecho). */

    const yaDicho=notes.some(n=>/[Ss]eries largas a ritmo/.test(n.t))&&/[Ss]eries largas a ritmo/.test(tFin);
    notes.push({k:pcNivel(sFin).key,m:"200 m · Final",
      t:`El último largo ha sido un <b>${dec(Math.abs(df))}%</b> ${df>=0?"más lento":"más rápido"} que tu ritmo de crucero.`
        +(yaDicho?tFin.replace(/\s*Series largas a ritmo (fijo|constante)[^.]*\./,""):tFin)});
    /* El tramo más flojo, para no mandar pulir "el tramo que flojea" sin decir cuál — y para no
       mandarlo cuando no hay ninguno por debajo de Buen ritmo. */
    const cand=[[sSal,"la salida"],[tr&&tr.sc!=null?tr.sc:null,"la entrada al ritmo de crucero"],
                [(s2+s3)/2,"el crucero"],[sFin,"el final"]].filter(x=>x[0]!=null);
    const flojo=cand.length?cand.reduce((a,b)=>b[0]<a[0]?b:a):null;
    const hayFlojo=flojo&&flojo[0]<70;
    /* ⚠️ Las dos frases de abajo acusan al ARRANQUE, así que tienen que comprobar que hubo arranque
       que acusar. Antes bastaba `sSal!=null` y se disparaban con la salida perfecta: Ibai Galarreta
       (200 Libre, 14-jun, global 27) recibía "salida por encima de tu ritmo" con un margen de 11,0%
       dentro de su banda 10,8–13,3, o sea nota 100. Eran 2 de las 6 carreras que llegan ahí. Ahora
       se pregunta por el signo del margen y, si la salida no fue agresiva, se usa la frase que ya
       existía para cuando no hay referencia: habla solo del ritmo y del final. */
    /* ⚠️ Antes bastaba `sal.d < sal.B[0]` —salida por debajo del p35— para acusar al arranque en la
       global. Con el rediseño de ago-2026 eso ya no vale: fuera del extremo no se califica la
       salida en ningún sitio, y la global no puede ser la excepción. Ahora solo lo dice cuando la
       propia Salida lo ha dicho, o sea cuando es CASO EVIDENTE. */

    const glob=(g>=90?"Reparto de energía muy maduro para la edad: primera mitad con cabeza y segunda sostenida."
      :g>=70?(hayFlojo?"Buen 200 en conjunto. Donde más margen queda es en "+flojo[1]+": ahí está el tiempo que falta."
                      :"Buen 200 en conjunto, sin ningún tramo que se descuelgue. Lo que queda es afinar, no corregir.")
      :g>=50?"200 correcto con altibajos: el ritmo no se mantiene igual en toda la carrera."
      :g>=30?(salAgr?"El 200 se te ha hecho largo. La clave está en sostener el crucero sin salir más fuerte de lo que puedes mantener."
                    :"El 200 se te ha hecho largo. La clave está en sostener el mismo ritmo en los cuatro largos.")
      :(salAgr?"Carrera muy irregular: has salido más fuerte de lo que podías sostener y el final ha quedado muy penalizado."
              :"Carrera muy irregular: el ritmo no se ha sostenido y el final ha quedado muy penalizado."))
      +(d<=B[1]
        ? ` Por mitades, la segunda cae un <b>${fmtp(d)}</b> respecto a la primera, dentro de lo que se considera buen reparto en ${est.toLowerCase()} (${nc(B[0])}–${nc(B[1])}%).`
        /* Si ningún tramo flojea pero las mitades se separan de lo normal, el reparto ES el punto:
           antes se soltaba la cifra detrás de "sin ningún tramo que se descuelgue" y chocaba. */
        : ` ${g>=70&&!hayFlojo?"Y ahí está el detalle":"Se ve por mitades"}: la segunda cae un <b>${fmtp(d)}</b> respecto a la primera, cuando lo habitual en ${est.toLowerCase()} es quedarse en ${nc(B[0])}–${nc(B[1])}%.`);
    return done(g,glob);
  }
  // ---------- Parciales incompletos ----------
  cs.forEach((c,i)=>rows.push(pcRow(((i+1)*50)+"m",vals[i],pcNom(i,cs.length,false),PC_SIN_VAL,bw(c))));
  return {rows:rows,notes:[],glob:"Parciales incompletos en el acta: se muestran los tramos disponibles, sin valoración de ritmo.",gkey:"na",lab:"Parciales",score:null};
}
function csFmt(cs){const s=cs/100;return s>=60?(Math.floor(s/60)+":"+(s%60<10?"0":"")+(s%60).toFixed(2)):s.toFixed(2);}
function fichCompCard(name,FE){

  let h=`<div class="ccCard"><div class="ccHead">${esc(comp)} · ${fmtDate(jorD(FE))}</div>`;
  h+=`<div class="pcList">`;

    const badge=an?`<span class="pcV pcV-${an.gkey}">${an.lab}${an.score!=null?` · ${an.score}`:""}</span>`:"";
    let body;

      body=c50?`<div class="pcPrev">${c50}</div>`:`<div class="pcnp">sin parciales</div>`;
    }

      body=(cM?`<div class="pcPrev">${cM}</div>`:"")+`<div class="pcBars">${an.rows.join("")}</div>`;
      if(an.notes.length)body+=`<div class="pcNotes">${an.notes.map(n=>`<div class="pcN pcN-${n.k}">${n.m?`<span class="pcNm">${n.m}</span>`:""}${n.t}</div>`).join("")}</div>`;
      const prev=pcPrevTxt(r.prueba,r.parciales,r.nadadora,r.fecha,r.competi);
      if(prev)body+=`<div class="pcPrev">${prev}</div>`;
      /* ⚠️ El rótulo sigue a la nota, no al revés (14-ago-2026). Un recuadro que empieza por
         «Valoración:» y sigue con «se muestran los parciales sin valorar» se contradice a sí mismo.
         Mismo arreglo que ya se hizo en las filas (`PC_SIN_VAL`), que llevaban «Ritmo óptimo · 100»
         en verde debajo de un texto que decía que ahí no se compara nada. */
      if(an.glob)body+=`<div class="pcGlob pcN-${an.gkey}"><b>${an.score==null?"Sin valorar":"Valoración"}:</b> ${an.glob}</div>`;
    }

  });

function poolRecs(recs){let out=recs;if(!yearAll())out=out.filter(r=>yearOn(claveEdad(r)));if(clubFilter!=="all")out=out.filter(r=>r.club===clubFilter);return out;}
// Clase de color por estilo (misma paleta que los chips y las tarjetas de ritmo).
/* Clase de color por estilo. Única fuente de la paleta: antes esta tabla estaba copiada
   cuatro veces (aquí, dos veces como stCls y una como stKl) y cambiar un color obligaba a
   acordarse de los cuatro sitios. Acepta la prueba entera ("200 Libre") o solo el estilo
   ("Libre"), que es como la necesita el carrusel de coronas del Top FINA. */
function stKlass(p){const w=String(p).split(" ");return ({Libre:"st-l",Espalda:"st-e",Braza:"st-b",Mariposa:"st-m",Estilos:"st-x"})[w[1]||w[0]]||"st-x";}
function bestOf(recs,name,prueba){let b=null,bc=Infinity;for(const r of recs){if(r.nadadora===name&&r.prueba===prueba){const c=toCs(r.tiempo);if(c<bc){bc=c;b=r;}}}return b;}
let RT_CACHE=new WeakMap();
function rankTime(recs,prueba){
  /* ⚠️ La lista se ORDENA para la clave: marcar 2014 y luego 2013 da el mismo ranking que al revés,
     y sin ordenar se guardarían dos entradas distintas para lo mismo. */
  const k=sexFilter+"|"+catFilter+"|"+yearFilter.slice().sort().join("+")+"|"+clubFilter+"|"+season+"|"+(_P50?"50":"25")+"|"+prueba;
  let m=RT_CACHE.get(recs);if(!m){m=new Map();RT_CACHE.set(recs,m);}
  const hit=m.get(k);if(hit)return hit;
  const val=(function(){const rr=poolRecs(recs).filter(r=>r.prueba===prueba);const names=[...new Set(rr.map(r=>r.nadadora))];const arr=names.map(n=>{const b=bestOf(rr,n,prueba);return{name:n,prueba:prueba,club:b.club,anio:b.anio,cs:toCs(b.tiempo),tiempo:b.tiempo,fecha:b.fecha,competi:b.competi};});arr.sort((a,b)=>a.cs-b.cs||a.name.localeCompare(b.name));arr.forEach((x,i)=>{x.rank=(i>0&&x.cs===arr[i-1].cs)?arr[i-1].rank:i+1;});return arr;})();
  m.set(k,val);return val;
}
function rankMap(arr){const m={};arr.forEach(x=>m[x.name]=x.rank);return m;}

function evolution(name,prueba){const sw=RECORDS.filter(r=>r.nadadora===name&&r.prueba===prueba);if(!sw.length)return null;const latest=sw.reduce((m,s)=>s.fecha>m?s.fecha:m,sw[0].fecha);if(latest<MAXFECHA)return null;const prev=bestBefore(name,prueba,latest);if(prev===null)return null;const lat=Math.min(...sw.filter(s=>s.fecha===latest).map(s=>toCs(s.tiempo)));if(lat<prev)return{dir:"up",d:prev-lat,date:latest};if(lat>prev)return{dir:"down",d:lat-prev,date:latest};return null;}

function abbrev(p){const sp=p.split(" ");const st={"Libre":"L","Espalda":"E","Braza":"B","Mariposa":"M","Estilos":"Est"}[sp[1]]||sp[1];return sp[0]+" "+st;}
function finaClass(recs,N){const R=poolRecs(recs);const names=[...new Set(R.map(r=>r.nadadora))];const arr=[];names.forEach(n=>{const byP={};for(const r of R){if(r.nadadora!==n)continue;const c=toCs(r.tiempo);if(byP[r.prueba]===undefined||c<byP[r.prueba].cs)byP[r.prueba]={cs:c,f:r.fecha,l:es50(r.competi)};}const list=Object.keys(byP).map(p=>({f:fina(p,byP[p].cs,byP[p].f,byP[p].l),p:p})).filter(x=>x.f>0).sort((a,b)=>b.f-a.f);if(list.length<N)return;const top=list.slice(0,N);const sum=top.reduce((a,b)=>a+b.f,0);const rec=R.find(r=>r.nadadora===n);arr.push({name:n,club:rec.club,anio:rec.anio,sum:sum,ntot:list.length,pruebas:top.map(x=>abbrev(x.p))});});arr.sort((a,b)=>b.sum-a.sum||a.name.localeCompare(b.name));arr.forEach((x,i)=>{x.rank=(i>0&&x.sum===arr[i-1].sum)?arr[i-1].rank:i+1;});return arr;}

/* "nuevo" = primer registro en esta prueba, que es lo que promete la leyenda. Si no hay puesto
   anterior CON EL QUE COMPARAR (primera jornada de una temporada) pero la persona ya nadó esta
   prueba en otra temporada, la columna se deja VACÍA: poner "nuevo" ahí sería falso, y encima
   contradiría a la pastilla ÚLT. COMP. de su misma fila. Los puestos con flecha no cruzan de
   temporada a propósito: el ranking anterior tenía otra población (los mayores suben de categoría). */
function posTag(cur,prevMap){if(!(cur.name in prevMap))return bestBefore(cur.name,cur.prueba,cur.fecha)===null?'<div class="pos new">nuevo</div>':"";const d=prevMap[cur.name]-cur.rank;if(d>0)return `<div class="pos up">↑${d}</div>`;if(d<0)return `<div class="pos down">↓${-d}</div>`;return '<div class="pos eq">=</div>';}
function medal(rank){if(rank===1)return{rail:"var(--gold)",bg:"var(--gold)",ink:"#3b2a06"};if(rank===2)return{rail:"var(--silver)",bg:"var(--silver)",ink:"#20262b"};if(rank===3)return{rail:"var(--bronze)",bg:"var(--bronze)",ink:"#2e1808"};return{rail:"transparent",bg:"var(--chip)",ink:"var(--muted)"};}
function gapTag(rec,par,lab,full){
  const nm=rec.name||rec.nadadora;
  const rt=minRow(par,marcaFila(nm,rec.prueba));
  const m=rt?rt.min:null;
  if(full){
    /* Sin "50 m" ni "con X" dentro de la pastilla: la piscina la dice el rótulo de la cabecera
       y el tiempo es el de la propia fila, así que la línea vuelve a leerse sola. */
    const L=`<span class="mlab">${lab}</span>`;
    if(!m)return`${L}<span class="tag na">sin mínima</span>`;
    const mt=`<span class="mmin"><i>mín.</i><span class="mono">${esc(m)}</span></span>`;
    const d=rt.cs-rt.mc;
    return d<=0?`${L}${mt}<span class="tag ok mono">−${fmtClock(-d)}</span>`
               :`${L}${mt}<span class="tag no mono">+${fmtClock(d)}</span>`;}
  // sin ✓: el verde de .tag.ok ya dice que está conseguida, y así los números
  // de EH y ESP quedan alineados sin necesidad de reservar carril para nada.
  /* ⚠️ AQUÍ YA NO VA NINGUNA PASTILLA DE PISCINA (§4.30). Estaba en las DOS líneas, EH y ESP, y
     era redundante: las dos se miden contra la MISMA marca (`marcaFila()` elige una y manda en
     toda la fila), así que nunca podían decir cosas distintas. Ahora el aviso va una sola vez,
     bajo el club, con la pastilla entera. El significado no cambia: la marca contra la que se
     mide la mínima es de piscina larga. */
  const black='<b style="color:#0b2a3a;font-weight:700">'+lab+'</b>';
  if(!m)return`<span class="tag na">${black} —</span>`;
  const dd=rt.cs-rt.mc;
  if(dd<=0)return`<span class="tag ok">${black} −${fmtClock(Math.abs(dd))}</span>`;
  return`<span class="tag no">${black} +${fmtClock(dd)}</span>`;}
/* Las mínimas van por categoría y año de nacimiento, así que no significan nada en un ranking que
   cruza temporadas: en Histórico no se pintan en ningún sitio. */
function minsOn(){return !isHist();}
/* Ya no vale comparar con bestBefore(): esa funcion devuelve centesimas y no sabe de que
   piscina venian, asi que no puede decir contra que liston medirlas. Se rehace la via con
   las marcas anteriores a la ultima jornada. */
function newMin(rec,par){if(!minsOn()||!hasMin(rec,par))return false;
  const nm=rec.name||rec.nadadora;
  const antes=RECORDS.filter(r=>r.nadadora===nm&&r.prueba===rec.prueba&&r.fecha<MAXFECHA);
  if(!antes.length)return true;
  const rt=minRow(par,marcaFila(nm,rec.prueba,antes));return !(rt&&rt.got);}
function hasMin(rec,par){const nm=rec.name||rec.nadadora;
  const rt=minRow(par,marcaFila(nm,rec.prueba));return !!(rt&&rt.got);}
/* ===== MINIMAS POR PISCINA =====================================================
   `par` es SIEMPRE [tabla25, tabla50]. minTbl() elige por la competicion de la marca.
   Si la celda larga no existe, cae a la de 25 m: preferimos comportarnos como antes
   a inventarnos un "sin minima" donde solo falta el dato. */
let PAR_EH=null,PAR_ESP=null,RUTA_CACHE=null;
function parOf(par){return Array.isArray(par)?par:[par,null];}
function minTbl(par,rec){const p=parOf(par);if(!p[1]||!es50(rec.competi))return p[0];
  const tb=p[1][sexFilter]||{};const ky=keyAnio(rec.anio,rec.fecha);return (tb[rec.prueba]&&tb[rec.prueba][ky])?p[1]:p[0];}
function minDe(par,rec){const tb=minTbl(par,rec)[sexFilter]||{};const ky=keyAnio(rec.anio,rec.fecha);
  return (tb[rec.prueba]&&tb[rec.prueba][ky])||null;}
/* MEJOR VIA hacia una minima: de todas las marcas de esa prueba, la que menos lejos queda
   del liston de SU piscina. No es la marca mas rapida: un 28.86 en larga puede estar mas
   cerca de la minima que un 28.06 en corta, porque el liston largo es otro. */
/* ===== UNA SOLA MARCA POR FILA (decisión de Fran, 13-ago-2026) ==================
   La fila de Mínimas enseña SIEMPRE una única marca, y todo —tiempo grande, fecha, puntos,
   las dos líneas de mínima y las dos barras— sale de ella. Regla:

     · por defecto, su mejor marca;
     · si la mejor NO da la mínima y su mejor marca de piscina larga SÍ, la fila entera
       pasa a la de larga y se rotula «Piscina 50m» junto al nombre de la prueba.

   ⚠️ NO volver a la versión anterior, que elegía una "vía" distinta para cada línea y añadía
   "con 28.86" dentro de la pastilla de la mínima. Era correcta pero ilegible: la fila enseñaba
   un tiempo arriba y las líneas hablaban de otro. Esta regla toca 14 filas en vez de 183 líneas
   y no necesita explicar nada dentro de la línea.
   ⚠️ Comprobado que el cambio nunca PIERDE la otra mínima (0 casos sobre 1.435 filas): si algún
   día apareciera uno, habría que decidir cuál de las dos manda, y hoy esa decisión no existe. */
function marcaFila(name,prueba,recs){
  const src=recs||RECORDS;
  const b=bestOf(src,name,prueba);if(!b)return null;
  const largas=src.filter(r=>r.nadadora===name&&r.prueba===prueba&&es50(r.competi));
  if(!largas.length)return b;
  let b50=largas[0];for(const r of largas)if(toCs(r.tiempo)<toCs(b50.tiempo))b50=r;
  if(b50===b)return b;
  const da=(r,par)=>{const m=minDe(par,r);return !!(m&&toCs(r.tiempo)<=toCs(m));};
  const desbloquea=(par)=>da(b50,par)&&!da(b,par);
  return (desbloquea(PAR_EH)||desbloquea(PAR_ESP))?b50:b;}
/* Datos de una línea de mínima PARA LA MARCA DE LA FILA. Nada de vías. */
function minRow(par,rec){
  if(!rec)return null;
  const m=minDe(par,rec);if(!m)return null;
  const cs=toCs(rec.tiempo),mc=toCs(m);
  return{rec:rec,min:m,cs:cs,mc:mc,got:cs<=mc,largo:es50(rec.competi)};}
/* Rótulo de piscina larga. Junto al NOMBRE DE LA PRUEBA en la ficha, no junto a los puntos: ahí hay
   sitio para escribirlo entero y se entiende que califica a TODA la fila, no solo a la cifra que
   tenga al lado. En el RANKING va en su propia línea bajo el club (clase `.pisLine`).
   ⚠️ El texto es `Piscina 50m`, con la M PEGADA: es una decisión de ancho medida, no una errata.
   Con el espacio, la pastilla se salía en `100 Mariposa` y `200 Mariposa` y caía a una segunda
   línea (§4.30). La pastilla corta `.mb50` sigue viva SOLO para los puntos FINA del ranking. */
function p50Pill(){return '<span class="mb mb50">50m</span>';}
function pisPill(){return '<span class="pis50">Piscina 50m</span>';}
function hasMinCs(cs,prueba,anio,tbl,fecha){const tb=tbl[sexFilter]||{};const m=tb[prueba]&&tb[prueba][keyAnio(anio,fecha)];if(!m)return false;return cs-toCs(m)<=0;}
function minsList(name){const esp=[],eh=[];if(!minsOn())return{esp:esp,eh:eh};
  PRUEBA_ORDER.forEach(p=>{if(!bestOf(RECORDS,name,p))return;
    const mf=marcaFila(name,p);
    const rE=minRow(PAR_ESP,mf);if(rE&&rE.got)esp.push(abbrev(p));
    const rH=minRow(PAR_EH,mf);if(rH&&rH.got)eh.push(abbrev(p));});
  return{esp:esp,eh:eh};}
/* `vacio` lo pasa quien llama: dice si encima no hay ningún bloque de mínimas conseguidas. */
function goalPill(name,vacio){
  if(!minsOn())return "";
  const cand=[];
  PRUEBA_ORDER.forEach(p=>{if(!bestOf(RECORDS,name,p))return;
    const mf=marcaFila(name,p);
    [["EH",PAR_EH],["ESP",PAR_ESP]].forEach(pair=>{const rt=minRow(pair[1],mf);
      if(rt&&!rt.got)cand.push({t:pair[0],p:p,d:rt.cs-rt.mc,rel:(rt.cs-rt.mc)/rt.mc,largo:rt.largo});});
  });
  if(!cand.length)return"";
  cand.sort((a,b)=>a.rel-b.rel);
  const hot=cand.filter(x=>x.rel<=0.02).slice(0,3);
  /* El "(a X)" sale de la mejor vía, que puede ser una marca de piscina larga. Sin decirlo, el
     número no se puede reconstruir desde la marca que se ve en la fila de esa prueba. */
  const gp=x=>x.t+" "+abbrev(x.p)+" (a "+fmtClock(x.d)+(x.largo?" en 50 m":"")+")";
  /* `solo` = no hay nada conseguido encima, así que esta línea no lleva raya ni hueco de separación.
     El rótulo va en negrita y el contenido no: es la misma jerarquía que usan las demás líneas. */
  const solo=arg=>arg?" solo":"";
  if(hot.length)return `<div class="mhGoal hot${solo(vacio)}">🎯 <b>A tiro:</b> ${hot.map(gp).join(" · ")}</div>`;
  const c=cand[0];
  return `<div class="mhGoal${solo(vacio)}">🎯 <b>Objetivo más cercano:</b> ${gp(c)}</div>`;
}
function profileStat(name){

     pastilla verde, que se leía como "conseguido: nada". La ESP ya se callaba cuando no había;
     ahora la EH hace lo mismo y, si no hay ninguna de las dos, no se pinta nada.
     ⚠️ El número NO va en Space Mono: no es un tiempo, es un recuento, y la regla de las cifras

function whenAwake(fn){
  try{
    const ctx=actx();if(!ctx)return;
    if(ctx.state==="running"){fn(ctx);return;}
    let done=false;
    const go=()=>{if(done)return;done=true;fn(ctx);};
    try{const p=ctx.resume();if(p&&p.then)p.then(go,()=>{});}catch(e){}
    setTimeout(()=>{if(ctx.state==="running")go();},90);
    setTimeout(()=>{if(ctx.state==="running")go();},260);
  }catch(e){}
}
function swoosh(entra){
  try{
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    whenAwake(ctx=>_swoosh(ctx,entra));
  }catch(e){}
}
function _swoosh(ctx,entra){
  try{
    const t=ctx.currentTime+.01,dur=.24,sr=ctx.sampleRate,n=Math.floor(sr*dur);
    const buf=ctx.createBuffer(1,n,sr),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n*.35);
    const src=ctx.createBufferSource();src.buffer=buf;
    const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.Q.setValueAtTime(1.15,t);
    bp.frequency.setValueAtTime(entra?750:2300,t);
    bp.frequency.exponentialRampToValueAtTime(entra?2400:700,t+dur);
    const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.setValueAtTime(320,t);
    const g=ctx.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.2,t+.05);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(hp);hp.connect(bp);bp.connect(g);g.connect(AC_BUS||ctx.destination);
    src.start(t);src.stop(t+dur);
  }catch(e){}
}

function mmpCurva(name,p,cs,rk,rkList){
  if(!rk)return "";
  /* ⚠️ Su posición se busca por NOMBRE, no con rk.rank-1: con empates delante el puesto ya no
     coincide con el índice de la lista. Pasa en 6 filas de 1.492, pero pasa. */
  const N=rkList.length,iYo=rkList.findIndex(x=>x.name===name);
  if(iYo<0)return "";
  const rot=`<div class="gtRow"><span class="gt">Su sitio en la prueba</span></div>`;
  const ant=iYo>0?rkList[iYo-1]:null;
  const pie=!ant?`<div class="paUna">Nadie por delante</div>`
    :`<div class="paTxt"><span class="sig">${(cs-ant.cs)<=0
        ?`${sexFilter==="M"?"empatado":"empatada"} con ${esc(shortName(ant.name))}`
        :`a <span class="v mono">${fmtGap(cs-ant.cs)}</span> de ${esc(shortName(ant.name))}`}</span>`+
      `<span class="b">a <span class="v mono">${fmtGap(cs-rkList[0].cs)}</span> ${sexFilter==="M"?"del líder":"de la líder"}</span></div>`;
  if(N<2)return `<div class="pa">${rot}${pie}</div>`;
  const ord=rkList.map(x=>x.cs).slice().sort((a,b)=>a-b);
  const lid=ord[0],med=ord[Math.floor((N-1)*0.5)];
  /* Corte del eje: `mediana + 2×(mediana − líder)`, y siempre ≥ su marca, así que la marca de la
     ficha SIEMPRE entra. Medido contra las alternativas: con ×3 la mitad izquierda del dibujo
     quedaba muerta (el hueco sin gente tenía mediana del 40%); con ×2 baja al 20% y solo quedan
     fuera el 2,6% de las marcas. Con ×1,5 el hueco baja al 5% pero ya se salen el 4,4%. */
  let corte=Math.max(med+2*(med-lid),cs);
  if(corte<=lid)corte=lid+1;
  const X=c=>Math.max(0,Math.min(100,100-((Math.min(c,corte)-lid)/(corte-lid))*100));
  /* ⚠️ Las que se salen NO entran en la montaña. Si entraran, quedarían amontonadas en la casilla
     0 y la curva dibujaría un bulto a la izquierda diciendo «aquí hay mucha gente» cuando lo
     cierto es que están lejos y sueltas. Se avisa con el borde desvanecido, no con un bulto falso. */
  const dentro=rkList.filter(x=>x.cs<=corte), fuera=N-dentro.length;
  /* Silueta: cada nadadora reparte peso sobre sus casillas vecinas (núcleo triangular), que es lo
     que convierte un histograma dentado en una montaña legible a 34 px.
     ⚠️ La escala vertical es LINEAL a propósito: la altura es proporcional al número de nadadoras.
     Se probó realzarla (elevándola a 1,5 y a 2) para que el pelotón destacara más —la altura media
     pasa del 43% del pico al 29% y al 23%— y Fran lo descartó: «quiero que sea realista ante todo».
     No reintroducir sin permiso explícito: un pico el doble de alto debe ser el doble de gente. */
  const NB=48,h=new Array(NB).fill(0);
  dentro.forEach(x=>{const i=Math.round(X(x.cs)/100*(NB-1));
    for(let d=-3;d<=3;d++){const j=i+d;if(j>=0&&j<NB)h[j]+=Math.max(0,4-Math.abs(d));}});
  let mx=0;h.forEach(v=>{if(v>mx)mx=v;});if(!mx)mx=1;
  const P=h.map((v,i)=>[i/(NB-1)*100,32-v/mx*28]);
  const linea=curvaPath(P),area=linea+" L100,34 L0,34 Z";
  const xy=X(cs),gid="cg"+(++CURVA_N);
  /* Relleno partido en su posición, con el tono fuerte a la IZQUIERDA: las que ya tiene detrás.
     Así el relleno deja de ser adorno y dice qué porción del campo ha dejado atrás. */
  /* El gesto necesita dos cosas que solo se saben aquí: la escala del eje (lid/corte, en
     centésimas) y la altura de la silueta en las 48 casillas, para posar el punto SOBRE la línea. */
  return `<div class="pa">${rot}<div class="cur" data-lid="${lid}" data-corte="${corte}" `+
    `data-h="${P.map(q=>q[1].toFixed(1)).join(",")}">`+
    `<svg viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true"><defs>`+
    `<linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="#a8d3e2"/><stop offset="1" stop-color="#cde5ed"/></linearGradient>`+
    `<clipPath id="c${gid}"><rect x="0" y="0" width="${xy.toFixed(2)}" height="34"/></clipPath></defs>`+
    `<path d="${area}" fill="#eaf2f6"/>`+
    `<path d="${area}" fill="url(#${gid})" clip-path="url(#c${gid})"/>`+
    `<path d="${linea}" fill="none" stroke="#7fb6c9" stroke-width="0.8" vector-effect="non-scaling-stroke"/></svg>`+
    (fuera?`<div class="curFade"></div>`:"")+
    `<div class="curPt" style="left:${xy.toFixed(2)}%;top:${P[Math.round(xy/100*(NB-1))][1].toFixed(1)}px"></div>`+
    `<div class="scrub"><div class="sPt"></div><div class="sLab mono"></div></div>`+
    `</div>${pie}</div>`;
}

   enseñaban igual dentro de infantil, que tiene los suyos desde el 11-ago (§4.15). Ahora se

     ficha se está mirando, tomada de su marca más reciente. */
  if(compsFor){

   +"<div class='lgH'>9 · Cuándo no se valora</div><b>En todas las pruebas</b>, encima del análisis aparece una línea gris con <b>tu marca frente a tu mejor marca anterior</b> de esa prueba, en segundos y centésimas. Es solo el dato del crono: <b>no tiene que ver con la nota de ritmo</b>, que mide cómo repartiste, no cuánto bajaste. En los <b>50</b> no hay tramos que comparar, así que esa línea es lo único que aparece. Si te quedas a menos del <b>2%</b> pone que la tienes al alcance, porque cuando no se baja marca la distancia habitual es del 1,7%. Tampoco cuenta para nada: es información. En el <b>100 estilos</b> cada 50 mezcla dos estilos, así que solo se muestran los parciales. Si el acta trae los parciales incompletos, se enseñan los que hay sin valorar el ritmo. Si el acta solo trae los parciales <b>cada 100</b> (pasa en algunos 800), no hay 1er 50 que medir y no se valoran ni la Salida ni la Transición. Y si <b>aún no habías nadado ningún 50 de ese estilo</b> antes de esa competición, la Salida aparece en gris como <i>sin referencia</i> y la global se calcula con el resto (pasa sobre todo al principio de temporada; según nadas 50s, se van valorando).<br><br><b>Cada piscina, con sus rangos.</b> En piscina larga el esfuerzo se reparte de otra manera —un 200 lleva 3 virajes en vez de 7—, así que no vale juzgarla con los rangos de 25 m. Las dos categorías tienen ya su <b>tabla propia de 50 m</b> —sacada de los <b>campeonatos de España</b> de la categoría, no de las marcas de Álava—, así que en piscina larga también hay nota. Y por venir de muestras distintas, una nota de 50 m y una de 25 m <b>no se comparan entre sí</b>. Una marca de una piscina <b>no sirve de referencia</b> para juzgar una carrera de la otra: los mejores 50 y los mejores 100 se buscan siempre dentro de la misma piscina. Lo que sí deja una carrera sin valorar es que el <b>acta traiga los parciales cada 100 m</b> en vez de cada 50, que en piscina larga pasa a menudo en el 200 y en el fondo: sin los largos no hay nada que comparar."
   +"<div class='lgH'>10 · De dónde salen estos números</div><div class='lgF'>"+(larga?"<b>Piscina de 50 m.</b> Estos rangos no salen de la app: son los <b>percentiles reales</b> de los <b>campeonatos de España</b> de "+CATL.toLowerCase()+", contando todas las nadadas, eliminatorias y finales, y quedándose solo con las edades que aquí forman la categoría. Se usa esa muestra porque en Álava todavía no hay carreras largas suficientes para fijar un rango fiable, y porque el reparto del esfuerzo es una <b>forma de nadar</b>, no una velocidad: se puede aprender de quien lo hace bien aunque vaya más rápido. Es un <b>estándar fijo</b>, no se recalcula cada temporada.<br><br>⚠️ Por eso una nota de <b>50 m</b> y una de <b>25 m</b> <b>no se comparan entre sí</b>: no salen de la misma muestra. La de 25 m mide contra las mejores carreras de esta app; esta mide contra un campeonato de España entero, eliminatorias incluidas, que es una muestra más ancha y por tanto algo más blanda. Sacar más nota en larga no significa haber repartido mejor.<br><br>Lo que sigue explica los rangos de <b>25 m</b>, que se calculan de otra manera:<br><br>":"")+"Los rangos son los <b>percentiles reales</b> de las marcas con parciales de esta misma app, <b>de "+CATL+"</b> y en <b>piscina de 25 m</b>, pero <b>no de todas</b>: de cada nadador/a se toma <b>su mejor carrera</b> en esa prueba, y solo cuenta la <b>mitad con mejor marca</b>. Así el listón no lo marca lo que hace la media, sino lo que hacen los mejores cuando les sale bien. En <b>alevín</b>, donde no quedaban al menos 12 marcas tras el filtro (mariposa de 200, el 800 y las de estilos) se mantienen los rangos calculados con todas; en <b>infantil</b>, la prueba que no llega a esas 12 marcas se queda directamente sin rango, y por eso hay pruebas que solo enseñan los parciales. La <b>Salida</b> es la excepción a propósito: se compara con la mejor marca de 50 de cada nadador/a, así que ya mide contra uno mismo y no depende del nivel del grupo. El rango óptimo es el tramo central y el extremo marca el suspenso. Por eso miden lo que de verdad hace un alevín o un infantil, no lo que hace un adulto de élite.<br><br>El modelo se apoya además en la literatura de <i>pacing</i>:<br>• <b>Menting y cols.</b>, <i>Pacing Behavior Development in Adolescent Swimmers</i> (3.498 nadadores en 100 y 2.230 en 200, de 12 a 24 años, cinco continentes): con la edad se aprende a contenerse en la salida para ir más fuerte por el medio, y el ritmo se vuelve más regular. Los perfiles juveniles son mucho más variables, y por eso aquí los márgenes son más anchos que en élite.<br>• <b><i>Pacing in World-Class Age Group Swimmers in 100 and 200 m Freestyle, Backstroke, Breaststroke and Butterfly</i></b> (IJERPH, 2020): las diferencias de ritmo entre estilos. <b>Ojo con el título</b>: ese <i>age group</i> no son categorías juveniles, sino <b>másters de 25 a 99 años</b>, y además en piscina de <b>50 m</b>. Por eso de aquí se toma solo la <b>comparación entre estilos</b> —que la braza reparta distinto que el libre es cosa de la brazada, no de la edad— y <b>nunca los valores</b>, que salen de nuestros propios datos en 25 m.<br>• <b><i>Pacing in World-Class Age Group Swimmers in 200 and 400 m Individual Medley</i></b> (Frontiers): el orden de los estilos dentro del IM —libre el más rápido, después mariposa, espalda y braza— que coincide exactamente con el reparto que sale en nuestros propios datos.</div>";

  const HIST_LEG="<span style='font-weight:700'>Modo Histórico.</span> Aquí no se filtra por temporada: "

   +"<div style='margin-top:7px'><span style='font-weight:700'>En «Promoción»</span> los botones son <b>años de nacimiento</b>: "

   +"<div style='margin-top:7px'><span style='font-weight:700'>Varias a la vez.</span> Aquí puedes marcar <b>más de un botón</b> "
   +"y ver un ranking conjunto (por ejemplo <b>2013 + 2014</b>); se pulsa otra vez para quitarlo. El primero "
   +"(<b>Todas</b> / <b>Todos</b>) va solo: al pulsarlo se apagan los demás, y si quitas el último vuelve él.</div></div>"
   +"<div style='margin-top:9px;padding-top:9px;border-top:1px solid var(--line)'>"
   +"<span style='font-weight:700'>Qué no aparece.</span> Las <b>mínimas</b> se quedan fuera: van por categoría y año de "
   +"nacimiento, y no significan nada cruzando temporadas."
   +"<div style='margin-top:7px'>Los <b>indicadores de última competición</b> funcionan igual, pero aquí solo salen si esa "
   +"marca es su mejor de siempre: el Histórico enseña la mejor, y si no la ha batido, no cambia.</div></div>";
  if(view==="marcas"){LEG_HTML=fo?legs.marcasFicha:legs.marcas;}
  else if(view==="topfina"){LEG_HTML=fo?legs.topfinaFicha:(finaSel==="med"?legs.topfinaMed:/^\d+$/.test(finaSel)?legs.topfina:(["spr","mid","fon","gfo"].indexOf(finaSel)>=0?legs.topfinaSpec:legs.topfinaRey));}
  else if(view==="minimas"){LEG_HTML=fo?legs.minimasFicha:legs.minimas;}

  if(badgesFor){const bsx=((ALLRECS.find(r=>r.nadadora===badgesFor)||{}).sexo)||sexFilter;const nb=bsx==="M"?"nadador":"nadadora";LEG_HTML="🏅 <span style='font-weight:700'>Recuento de insignias.</span> Todas las insignias que ha conseguido en los resúmenes de las competiciones "+legAmbito()+". Se gana una por cada podio (🥇🥈🥉) en estos cuatro apartados del resumen:<br>"+legPodios(nb,false)+"<br>"+legOlimpico();}

  const st=el("secTitle");if(st)st.textContent=fo?"Fichas individuales":(isHist()?"Ranking histórico":"Ranking de la temporada");
  const sc=el("secdiv");if(sc&&sc.classList)sc.classList.toggle("fmode",fo);
  const tbs=el("tabs");
  if(tbs&&tbs.querySelectorAll){const bm=tbs.querySelector('button[data-v="minimas"]');if(bm)bm.style.display=isHist()?"none":"";const fo2=fo;const lbl=fo2?{marcas:"MMP/progreso",minimas:"Mínimas",topfina:"Récords Álava"}:{marcas:"Marcas (MMP)",minimas:"Mínimas",topfina:"Top FINA"};tbs.querySelectorAll("button").forEach(bt=>{const v=bt.dataset?bt.dataset.v:null;if(v&&lbl[v])bt.textContent=lbl[v];});}
  const bf=el("backFloat");if(bf)bf.style.display=(fo||cmpA||badgesFor||compsFor)?"inline-flex":"none";
  const sIn=el("search");if(sIn)sIn.placeholder=(sexFilter==="M"?"Busca un nadador…":"Busca una nadadora…");
  const vw=el("view");

  if(fo){renderProfile(vw);return;}
  if(view==="topfina"){renderClass(vw,finaN);return;}

  // per-prueba (marcas / minimas)
  const present=pruebasPresent();
  if(present.length&&!present.includes(activePrueba))activePrueba=present[0];
  const chips1=present.map(p=>`<button class="chip ${stKlass(p)} ${p===activePrueba?"on":""}" data-p="${esc(p)}">${esc(p)}</button>`).join("");
  const chips=chips1+chips1+chips1;
  const rk=rankTime(RECORDS,activePrueba);
  const prev=rankMap(rankTime(BEFORE,activePrueba));
  const rows=rk.map(r=>{

    if(view==="marcas"){
      /* MMP DE TEMPORADAS ANTERIORES (ago-2026). Solo en modo temporada: en Histórico la fila YA es

         FINA: el ranking sigue siendo íntegramente de la temporada. */
      const pm=isHist()?null:prevSeasonBest(r.name,r.prueba,season);
      if(pm&&pm.cs<r.cs)sub=`<div class="mmpPrev"><span class="lb">MMP</span><span class="mono">${esc(pm.t)}</span> · ${fmtDate(pm.f)}</div>`;
      const f=fina(r.prueba,r.cs,r.fecha,es50(r.competi));const ev=evolution(r.name,r.prueba);const dt=deltaTag(ev,1);
      const dstr=!/^Ranking /.test(r.competi||"")?`<span class="tdate">${fmtDate(r.fecha)}</span>`:"";
      if(newMin(r,PAR_EH))badges+='<span class="mb mbEH" style="margin-right:4px">EH</span>';

      right=`<div class="time mono">${dstr}${esc(r.tiempo)}</div><div><span class="tag fina">${es50(r.competi)?p50Pill()+" ":""}${f} FINA</span></div>${(dt||badges)?("<div>"+badges+dt+"</div>"):""}`;
      badges="";
    }else{
      /* La pastilla va UNA VEZ, bajo el club, en el mismo sitio donde la vista de Marcas pone la
         línea de MMP anterior. Se enciende con la marca que eligió `marcaFila()`, que es contra la
         que se miden las dos líneas de mínima.
         ⚠️ En el ranking el tiempo grande de la derecha es SIEMPRE su mejor marca, porque es la que
         ordena la lista. En 14 filas de 170 esa no es la marca contra la que se mide la mínima, y
         por eso al lado de la pastilla se escribe el tiempo largo —discreto, 11 px— pero SOLO
         cuando es distinto del que se ve: si coinciden, repetirlo sería ruido.
         ⚠️ Esto NO es la versión rechazada del §4.19. Aquella metía «con 28.86» DENTRO de la
         pastilla de la mínima, en 183 líneas, y hacía que la línea hablase de un tiempo distinto
         del de su propia fila. Esta vive fuera, junto al aviso de piscina que ya la justifica, y
         solo en las filas donde de verdad hay dos marcas en juego. */
      const mfR=marcaFila(r.name,r.prueba);
      /* DÓNDE VA LA PASTILLA (§4.35). La regla es una y se enuncia así: la pastilla SIEMPRE toca la
         marca de la que habla. Si la marca medida es la que se ve a la derecha —156 filas de 170—,
         va delante de ese tiempo, en el hueco que en Marcas ocupa la fecha. Si no lo es —las 14—,
         no puede ir ahí sin mentir sobre el tiempo grande, así que baja bajo el club, entera y con
         el tiempo largo al lado, exactamente como estaba.
         ⚠️ La pastilla NO se condiciona, solo cambia de sitio: se enciende siempre que la marca
         medida es de piscina larga (§4.32). Encenderla a veces sería el fallo del §4.20. */
      let preT="";

  }).join("");

  vw.innerHTML=`<div class="chipwrap"><div class="chips">${chips}</div></div>${body}`;
  animateTags(vw);
  const ce=vw.querySelector(".chips");
  if(ce){
    const n=present.length;
    const kids=ce.children||[];
    const period=(n>0&&kids.length>=2*n&&kids[n]&&kids[n].offsetLeft!==undefined)?(kids[n].offsetLeft-kids[0].offsetLeft):0;
    const norm=x=>{if(!period)return x;while(x<period*0.5)x+=period;while(x>period*1.5)x-=period;return x;};
    ce.scrollLeft=norm(chipScrollPos);

    };
    const idx=present.indexOf(activePrueba);
    if(idx>=0&&period){
      const centerNow=ce.scrollLeft+ce.clientWidth/2;
      let bestT=null,bestD=Infinity;
      [idx,idx+n,idx+2*n].forEach(k=>{const el2=kids[k];if(!el2)return;const t=el2.offsetLeft-(ce.clientWidth-el2.clientWidth)/2;const d=Math.abs((el2.offsetLeft+el2.clientWidth/2)-centerNow);if(d<bestD){bestD=d;bestT=t;}});
      if(bestT!==null){
        chipAnim=true;
        const smooth=(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth";
        try{ce.scrollTo({left:bestT,behavior:smooth});}catch(e){ce.scrollLeft=bestT;}
        setTimeout(()=>{chipAnim=false;ce.scrollLeft=norm(ce.scrollLeft);chipScrollPos=ce.scrollLeft;},450);
      }
    }
  }
  vw.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{activePrueba=c.dataset.p;render();});
}

function finaStyle(recs,stroke){const R=poolRecs(recs);const names=[...new Set(R.map(r=>r.nadadora))];const arr=[];names.forEach(n=>{const byP={};for(const r of R){if(r.nadadora!==n||r.prueba.split(" ")[1]!==stroke)continue;const c=toCs(r.tiempo);if(byP[r.prueba]===undefined||c<byP[r.prueba].cs)byP[r.prueba]={cs:c,f:r.fecha,l:es50(r.competi)};}const list=Object.keys(byP).map(p=>({f:fina(p,byP[p].cs,byP[p].f,byP[p].l),p:p,cs:byP[p].cs})).filter(x=>x.f>0).sort((a,b)=>b.f-a.f);if(!list.length)return;const sum=list.reduce((a,b)=>a+b.f,0);const rec=R.find(r=>r.nadadora===n);arr.push({name:n,club:rec.club,anio:rec.anio,sum:sum,ntot:list.length,pruebas:list.map(x=>abbrev(x.p))});});arr.sort((a,b)=>b.sum-a.sum||a.name.localeCompare(b.name));arr.forEach((x,i)=>{x.rank=(i>0&&x.sum===arr[i-1].sum)?arr[i-1].rank:i+1;});return arr;}
function finaSpec(recs,dA,dB){const R=poolRecs(recs);const names=[...new Set(R.map(r=>r.nadadora))];const arr=[];names.forEach(n=>{let a=null,b=null;for(const r of R){if(r.nadadora!==n)continue;const d=r.prueba.split(" ")[0];if(d!==dA&&d!==dB)continue;const f=finaR(r);if(d===dA&&(!a||f>a.f))a={f:f,p:r.prueba};if(d===dB&&(!b||f>b.f))b={f:f,p:r.prueba};}if(!a||!b)return;const rec=R.find(r=>r.nadadora===n);arr.push({name:n,club:rec.club,anio:rec.anio,sum:a.f+b.f,pruebas:[abbrev(a.p),abbrev(b.p)]});});arr.sort((x,y)=>y.sum-x.sum||x.name.localeCompare(y.name));arr.forEach((x,i)=>{x.rank=(i>0&&x.sum===arr[i-1].sum)?arr[i-1].rank:i+1;});return arr;}
/* PERFILES DEL TOP FINA. `finaSpec` exige las DOS distancias, así que un perfil cuyas pruebas no se
   nadan en el ámbito actual daría una lista vacía. Por eso Gran fondo (800+1500) solo aparece donde
   hay 1500: hoy infantil sí, alevín no. ⚠️ Se pregunta a los datos, no a una lista de categorías:
   el día que un alevín nade un 1500, el perfil aparece solo. */
const SPEC_FINA={spr:["50","100"],mid:["200","400"],fon:["400","800"],gfo:["800","1500"]};
/* Los rótulos viven aquí y no dentro de `renderClass`, porque la leyenda de Especialistas también
   los necesita: escritos dos veces se separan (le pasó a la propia leyenda, que se quedó sin
   Gran fondo cuando entró el 1500). */
const SPEC_LAB={spr:"🚀 Velocista",mid:"⏱️ Mediofondista",fon:"🌊 Fondista",gfo:"🐋 Gran fondo"};
function hayGF(){return RECORDS.some(r=>r.prueba.split(" ")[0]==="1500");}
function finaSelOk(){
  /* Al cambiar de categoría o de sexo el perfil elegido puede dejar de existir. Sin esto, quien
     estuviera en Gran fondo y saltara a alevín se quedaba mirando una lista vacía sin chip marcado. */
  if(finaSel==="gfo"&&!hayGF())finaSel="3";
}

    /* ⚠️ La clave del segmentado de años NO siempre es el año de nacimiento: en Histórico dentro de

       vacía con el mensaje "Aún no hay insignias". Aquí, además, una misma persona puede tener

    if(!yearAll()||clubFilter!=="all"){t=t.map(a=>Object.assign({},a));let rk=0,pg=null,ps=null,pb2=null;t.forEach((a,i)=>{if(a.g!==pg||a.s!==ps||a.b!==pb2){rk=i+1;pg=a.g;ps=a.s;pb2=a.b;}a.rank=rk;});}
    body=!t.length?`<div class="empty">Aún no hay insignias${isHist()?"":" esta temporada"}${!yearAll()?" con este filtro":""}.</div>`:

      }).join("")+`</div>`;
  }
  else if(!cur.length){
    body=`<div class="empty">${isNum?(clubFilter==="all"?("Aún no hay "+(sexFilter==="M"?"nadadores":"nadadoras")+" con <b>"+N+" pruebas</b>."):("Sin "+(sexFilter==="M"?"nadadores":"nadadoras")+" de <b>"+esc(clubFilter)+"</b> con "+N+" pruebas.")):(isSpec?("Aún nadie tiene marcas en <b>"+SPEC[finaSel][0]+" y "+SPEC[finaSel][1]+"</b>."):("Aún nadie ha nadado <b>"+esc(finaSel)+"</b>"+(clubFilter==="all"?"":" en "+esc(clubFilter))+"."))}</div>`;
  }else{
    const rows=cur.map(r=>{const m=medal(r.rank);

    const norm=x=>{if(!period)return x;while(x<period*0.5)x+=period;while(x>period*1.5)x-=period;return x;};
    ce.scrollLeft=norm(finaChipPos);
    ce.onscroll=()=>{finaChipPos=ce.scrollLeft;if(!finaChipAnim&&period){const x=ce.scrollLeft;if(x<period*0.3)ce.scrollLeft=x+period;else if(x>period*1.7)ce.scrollLeft=x-period;}};
    const idx=items.findIndex(it=>it.v===finaSel);
    if(idx>=0&&period){
      const centerNow=ce.scrollLeft+ce.clientWidth/2;
      let bestT=null,bestD=Infinity;
      [idx,idx+n2,idx+2*n2].forEach(k=>{const el2=kids[k];if(!el2)return;const t=el2.offsetLeft-(ce.clientWidth-el2.clientWidth)/2;const d=Math.abs((el2.offsetLeft+el2.clientWidth/2)-centerNow);if(d<bestD){bestD=d;bestT=t;}});
      if(bestT!==null){
        finaChipAnim=true;
        const smooth=(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)?"auto":"smooth";
        try{ce.scrollTo({left:bestT,behavior:smooth});}catch(e){ce.scrollLeft=bestT;}
        setTimeout(()=>{finaChipAnim=false;ce.scrollLeft=norm(ce.scrollLeft);finaChipPos=ce.scrollLeft;},450);
      }

function foundSwimmers(){

  return cand.filter(c=>{const hay=normName(c.name+" "+c.club);return qtok.every(t=>hay.includes(t));});

function renderProfile(vw){
  const SREC=scopeRecs();
  if(!query.trim()){vw.innerHTML=`<div class="empty tall">Escribe el nombre de ${sexFilter==="M"?"un nadador":"una nadadora"} o su club para ver su ficha, o vuelve al ranking con <b>← Volver</b>.</div>`;animateBars(vw);return;}
  const found=foundSwimmers();
  // SEGURO, no es código muerto: hoy es inalcanzable porque en fichas el buscador
  // va oculto (body.mfich .searchwrap) y query solo lo fija goProfile() con un nombre
  // real. Pero sin esta salida, un found vacío revienta en found[0].name tres líneas
  // más abajo: ficha en blanco. Si algún día vuelve el buscador en fichas, hace falta.
  if(!found.length){vw.innerHTML=`<div class="empty tall">Sin resultados para <b>“${esc(query)}”</b>.</div>`;return;}
  const exact=found.find(c=>normName(c.name)===normName(query));
  const savedClub=clubFilter,savedSex=sexFilter,savedRec=RECORDS,savedMax=MAXFECHA,savedJor=MAXJOR;
  found.sort((a,b)=>(a.sexo===savedSex?0:1)-(b.sexo===savedSex?0:1));
  clubFilter="all";
  const html=[exact||found[0]].map(c=>{
    const name=c.name;
    if(sexFilter!==c.sexo){sexFilter=c.sexo;setRecs(SREC.filter(r=>r.sexo===sexFilter));}
    /* ⚠️ El selector filtra en el ORIGEN y filtra SIEMPRE, en los dos sentidos.
       La primera versión solo filtraba el lado de 50 m y dejaba el de 25 m "como estaba", o sea
       MEZCLADO: a Yeray le salía su 800 de piscina larga (9:00.23) dentro de la pestaña de 25 m,
       comparado contra el récord de Álava de 25 m y contra el récord del mundo de corta, y
       cantaba "¡Récord de Álava batido!". Un tiempo largo no se compara jamás contra referencias
       de corta. Cada pestaña solo admite marcas de su piscina. */
    _P50=(view==="topfina"&&poolSel==="50");
    if(view==="topfina")RECORDS=RECORDS.filter(r=>es50(r.competi)===_P50);
    const rec0=RECORDS.find(r=>r.nadadora===name);
    let ri=0;
    const rows=PRUEBA_ORDER.map(p=>{const b=bestOf(RECORDS,name,p);
      if(!b){
        /* PRUEBA SOLO CON DESCALIFICACIONES (jul-2026). Sin marca válida no había fila que
           desplegar, así que 19 de las 30 descalificaciones quedaban escondidas — y justo en las
           pruebas donde más se descalifica (400 Estilos, 100 Mariposa, que se nadan una o dos veces
           al año). Se emite una fila sobria, sin puesto ni puntos porque no hay nada que rankear,
           solo para que el desplegable exista. Únicamente en la vista de marcas: en mínimas y en
           top FINA una fila sin tiempo no significa nada. */
        if(view!=="marcas")return"";
        const nd=dsqOf(name,p).length;
        if(!nd)return"";
        const anim2=`animation:vfade .32s ease-out ${(ri++)*38}ms backwards`;
        return `<div class="pRow tog pRowDsq" style="${anim2}"><div class="mid"><div class="prueba ${stKlass(p)}">${esc(p)}</div><div class="puesto">Sin marca · ${nd} ${nd===1?"descalificación":"descalificaciones"}</div></div><div class="right"><div class="time dsqT">DSQ</div>${histPill(name,p)}</div></div>`+histBox(name,p);
      }
      const cs=toCs(b.tiempo);const rkList=rankTime(RECORDS,p);const rk=rkList.find(x=>x.name===name);const ev=evolution(name,p);
      const dt=deltaTag(ev,0,1);const dstr=!/^Ranking /.test(b.competi||"")?`<span class="tdate">${fmtDate(b.fecha)}</span>`:"";
      const f=fina(p,cs,b.fecha,es50(b.competi));
      let detail,recs="",stamp="";
      if(view==="topfina"){
        /* Edad = la que cumple en el año en que acaba esa temporada. Estaba cableado a 2013/2014
           y habría mentido en cuanto entrasen otras cohortes. */
        const TB=tablesAt(b.fecha);
        const edad=edadDe(b.anio,b.fecha);
        const RAT=(_P50?TB.REC_ALAVA_50:TB.REC_ALAVA)||{};
        const BT=(_P50?TB.BASE_50:TB.BASE)||{};
        const raD=recDe(RAT[sexFilter]||{},p,b.anio,b.fecha),ra=raD&&raD.t;
        const rmT=fmtClock(Math.round(((BT[sexFilter]||{})[p]||0)*100));
        if(ra){
          const rcs=toCs(ra),dif=cs-rcs;
          detail=dif<=0
            ?`<div class="raline rabeat">¡Récord de Álava batido!</div><div class="rmbar"><div class="rmfill rfbeat" style="width:100%"></div></div>`
            :`<div class="raline">Récord de Álava a ${fmtClock(dif)}</div><div class="rmbar"><div class="rmfill" style="width:${Math.max(1,Math.min(100,rcs/cs*100)).toFixed(1)}%"></div></div>`;
          recs=`<div class="time mono recFaint"><span class="recL">${esc(raD.lab)}</span>${esc(ra)}</div><div class="time mono recFaint rm2"><span class="recL">World Record</span>${rmT}</div>`;
        }else{
          detail="";
          recs=`<div class="time mono recFaint rm2"><span class="recL">World Record</span>${rmT}</div>`;
        }
      }else if(view==="marcas"){
        /* Los dos gráficos se montan aparte y NO van en `detail`: `detail` cae dentro de .mid y
           estos van a lo ancho de la fila entera. Ver el `return` de más abajo. */
        detail="";
      }else{
        /* Una sola marca manda en toda la fila: tiempo, fecha, puntos, líneas y barras. */
        const mf=marcaFila(name,p)||b;
        const mline=(tbl,lab)=>{const rt=minRow(tbl,mf);if(!rt)return "";
          const m=rt.min,mc=rt.mc,got=rt.got,pct=got?100:Math.max(3,Math.min(99,mc/rt.cs*100));
          const bg=got?"":`background-size:${Math.round(100/pct*100)}% 100%;`;
          const ck=`${sexFilter}|${name}|${p}|${lab}`;
          return `${gapTag(b,tbl,lab,1)}<div class="mrow"><div class="mbar"><div class="mfill${got?" mok":""}" style="${bg}width:0%" data-pct="${pct.toFixed(1)}" data-ck="${esc(ck)}"></div></div><span class="mpct">0%</span></div>`;};
        detail=`<div class="pmin">${mline(PAR_EH,"EH")}${mline(PAR_ESP,"ESP")}</div>`;
        const gEsp=minsOn()&&hasMin(b,PAR_ESP),gEh=minsOn()&&hasMin(b,PAR_EH);
        if(gEsp||gEh){
          const lab=gEsp?"ESP":"EH";
          const cel=pendingKey("sh:"+sexFilter+"|"+name+"|"+p+"|"+lab);
          stamp=`<div class="stamp${cel?" pre":""}">${sexFilter==="M"?"CLASIFICADO":"CLASIFICADA"} ${lab}</div>`;
        }
      }
      const tf=view==="topfina";
      let pctTxt="",pctBadge="";
      if(view==="marcas"&&rk){
        const N=rkList.length;
        const pct=N>1?Math.round((N-rk.rank)/(N-1)*100):100;
        pctTxt=` · Percentil ${pct}`;
        if(N>=5&&pct>=80){const bd=pct>=95?['<span class="emo eo">🫍</span>',"TOP 5%","pb5"]:(pct>=90?['<span class="emo">🦈</span>',"TOP 10%","pb10"]:['<span class="emo">🐬</span>',"TOP 20%","pb20"]);pctBadge=`<span class="pctline pctIn">${bd[0]}<span class="pctb ${bd[2]}">${bd[1]}</span></span>`;}
      }
      const anim=`animation:vfade .32s ease-out ${(ri++)*38}ms backwards`;
      if(view==="minimas"){
        /* La fila entera habla de la marca elegida por marcaFila(): tiempo, fecha y puntos
           incluidos. `Nº` no: ese es su puesto en el ranking y no depende de esta fila. */
        const mf=marcaFila(name,p)||b;
        const fMF=finaR(mf);
        const dMF=!/^Ranking /.test(mf.competi||"")?`<span class="tdate">${fmtDate(mf.fecha)}</span>`:"";
        /* ⚠️ En Mínimas el tiempo era hijo directo de `.mHead`, que es un flex con
           `justify-content:space-between`. Colgar la pastilla ahí como TERCER hijo habría repartido
           los tres a lo ancho. Se envuelve tiempo + pastilla en la misma `.right` que usan las otras
           tres filas, así que `.mHead` sigue teniendo dos hijos y la columna derecha se escribe
           igual en toda la ficha. Aquí no hay `ÚLT. COMP.` (no lo lleva esta pestaña). */
        return `<div class="pRow tog mmRow" style="${anim}">${stamp}<div class="mHead"><div><div class="prueba ${stKlass(p)}">${esc(p)}${es50(mf.competi)?pisPill():""}</div><div class="puesto">Nº ${rk?rk.rank:"-"} · ${fMF} pts</div></div><div class="right"><div class="time mono">${dMF}${esc(mf.tiempo)}</div>${histPill(name,p)}</div></div>${detail}</div>`+histBox(name,p);}
      /* Rótulo de piscina larga en MARCAS (MMP/progreso). Se pregunta por `b`, la marca que
         ESTA fila enseña (la mejor), NO por marcaFila(): mínimas puede estar enseñando otra.
         Caso real: quien tiene su mejor 100 en 25 m pero consigue la mínima por la vía larga ve
         `Piscina 50m` en Mínimas y no aquí, y es correcto: cada pestaña rotula SU marca.
         En topfina no va: lo dice el selector de piscina (§4.20). */
      /* ⚠️ LA PASTILLA VA LA ÚLTIMA DE LA COLUMNA DERECHA (Fran, 21-ago-2026): debajo del tiempo y,
         cuando aparece `ÚLT. COMP.`, debajo de eso. `dt` ya es lo último, así que basta con
         añadirla detrás. `der` lo usan DOS filas —MMP/progreso y Récords—, así que un solo cambio
         cubre las dos. */
      const der=`<div class="right"><div class="time mono">${dstr}${esc(b.tiempo)}</div>${recs}${(!tf&&dt)?("<div>"+dt+"</div>"):""}${histPill(name,p)}</div>`;
      if(view==="marcas"){
        /* La insignia TOP se muda al lado del nombre de la prueba y los dos gráficos van a lo ancho
           de la fila entera, fuera de .pCols. `pmRow` devuelve la fila a display:block: .pRow es
           flex y con los gráficos dentro se habrían colocado como tercera columna. */
        return `<div class="pRow tog pmRow" style="${anim}">${stamp}<div class="pCols"><div class="mid">`+
          `<div class="prueba ${stKlass(p)}">${esc(p)}${es50(b.competi)?pisPill():""}${pctBadge}</div>`+
          `<div class="puesto">Nº ${rk?rk.rank:"-"} · ${f} pts${pctTxt}</div></div>${der}</div>`+
          mmpProg(name,p,cs)+mmpCurva(name,p,cs,rk,rkList)+`</div>`+histBox(name,p);
      }
      return `<div class="pRow tog" style="${anim}">${stamp}<div class="mid"><div class="prueba ${stKlass(p)}">${esc(p)}</div><div class="puesto">Nº ${rk?rk.rank:"-"} · ${f} pts${pctTxt}</div>${detail}</div>${der}</div>`+histBox(name,p);
    }).join("");
    /* La cabecera solo existe si tiene algo dentro: con la EH callada (ver profileStat) podía
       quedar un .pMinHead vacío metiendo 14 px de aire muerto encima de la primera prueba. */
    /* Lo conseguido y el objetivo comparten UNA caja: son la misma historia (lo que ya tiene y lo
       que le falta), y hasta hoy iban en recuadros distintos y ni siquiera alineados entre sí. */
    const mhSt=view==="minimas"?profileStat(name):"";
    const mh=view==="minimas"?(mhSt+goalPill(name,!mhSt)):"";
    /* Sin esto, quien no haya nadado nunca en largo veria un panel en blanco sin explicacion. */
    if(_P50&&!rows)return `<div class="profile"><div class="pRow"><div class="mid"><div class="puesto">Sin marcas en piscina de 50 m.</div></div></div></div>`;
    return `<div class="profile">${mh?`<div class="pMinHead"><div class="mhBox">${mh}</div></div>`:""}${rows}</div>`;
  }).join("");
  _P50=false;
  clubFilter=savedClub;sexFilter=savedSex;RECORDS=savedRec;MAXFECHA=savedMax;MAXJOR=savedJor;
  vw.innerHTML=html;
  animateBars(vw);
}
